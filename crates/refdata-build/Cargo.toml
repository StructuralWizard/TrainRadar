[package]
name = "trainradar-refdata-build"
description = "Native CLI that turns Renfe static GTFS into compact .bin reference files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "refdata-build"
path = "src/main.rs"

[dependencies]
csv = "1"
serde_json = "1"
trainradar-proto.workspace = true
serde.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
