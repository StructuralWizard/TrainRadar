<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mapa en directo de trenes de Renfe, coloreados por retraso. Funciona en tu navegador.">
  <meta name="theme-color" content="#1d4ed8">
  <!-- Feed text is untrusted: no inline scripts, no third-party scripts.
       connect-src: map tiles, and the feed pass-through (set at deploy). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tms-pnoa-ma.idee.es; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://tms-pnoa-ma.idee.es; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>TrainRadar</title>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="app.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <div id="map" role="application" aria-label="Mapa de trenes"></div>

  <header class="bar">
    <div class="brand">TrainRadar</div>
    <div class="bar-text">
      <div id="stats" aria-live="polite"></div>
      <div id="status" class="muted"></div>
    </div>
    <button id="fav-btn" class="pill" type="button">★</button>
    <button id="about-btn" class="pill" type="button">ⓘ</button>
    <button id="lang" class="pill" type="button">EN</button>
  </header>

  <div id="legend" class="legend"></div>

  <div class="controls">
    <div class="search">
      <input id="search-q" type="search" inputmode="search" autocomplete="off" aria-label="Buscar tren">
      <ul id="search-results" class="search-results" hidden></ul>
    </div>
    <select id="jump" aria-label="Ir a"></select>
    <details id="layers">
      <summary id="layers-title"></summary>
      <h4 id="g-trains"></h4>
      <label><input type="checkbox" id="f-commuter" checked> <i class="train-key"></i><span id="f-commuter-l"></span></label>
      <label><input type="checkbox" id="f-av" checked> <i class="train-key"></i><span id="f-av-l"></span></label>
      <label><input type="checkbox" id="f-ld" checked> <i class="train-key"></i><span id="f-ld-l"></span></label>
      <label><input type="checkbox" id="f-md" checked> <i class="train-key"></i><span id="f-md-l"></span></label>
      <label><input type="checkbox" id="f-scheduled" checked> <i class="train-key"></i><span id="f-scheduled-l"></span></label>
      <h4 id="g-map"></h4>
      <label><input type="checkbox" id="f-lines" checked> <span id="f-lines-l"></span></label>
      <label><input type="checkbox" id="f-tav" checked> <i class="track-key"></i><span id="f-tav-l"></span></label>
      <label><input type="checkbox" id="f-tld" checked> <i class="track-key"></i><span id="f-tld-l"></span></label>
      <label><input type="checkbox" id="f-tmd" checked> <i class="track-key"></i><span id="f-tmd-l"></span></label>
      <label><input type="checkbox" id="f-stations" checked> <span id="f-stations-l"></span></label>
      <h4 id="g-incidents"></h4>
      <label><input type="checkbox" id="f-k-disruption" checked> <i class="kind-dot"></i><span id="f-k-disruption-l"></span></label>
      <label><input type="checkbox" id="f-k-works" checked> <i class="kind-dot"></i><span id="f-k-works-l"></span></label>
      <label><input type="checkbox" id="f-k-accessibility" checked> <i class="kind-dot"></i><span id="f-k-accessibility-l"></span></label>
      <label><input type="checkbox" id="f-k-strike" checked> <i class="kind-dot"></i><span id="f-k-strike-l"></span></label>
      <label><input type="checkbox" id="f-k-other" checked> <i class="kind-dot"></i><span id="f-k-other-l"></span></label>
      <label><input type="checkbox" id="f-stopped" checked> <i class="kind-ring"></i><span id="f-stopped-l"></span></label>
      <h4 id="g-base"></h4>
      <div class="basemap">
        <label><input type="radio" name="basemap" value="standard" checked> <span id="b-standard-l"></span></label>
        <label><input type="radio" name="basemap" value="satellite"> <span id="b-satellite-l"></span></label>
      </div>
    </details>
  </div>

  <div class="bottom">
    <div class="actions">
      <button id="center-btn" class="pill" type="button" hidden>◎</button>
      <button id="loc-btn" class="pill" type="button" aria-pressed="false"></button>
      <button id="inc-btn" class="pill" type="button"></button>
      <button id="delayed-btn" class="pill pill-strong" type="button"></button>
    </div>
  </div>

  <div id="app-banner" class="app-banner" hidden>
    <a id="app-banner-link" target="_blank" rel="noopener"></a>
    <button id="app-banner-close" class="pill" type="button">✕</button>
  </div>

  <section id="about" class="sheet" hidden>
    <div class="sheet-head">
      <h2 id="about-title"></h2>
      <button id="about-close" class="pill" type="button">✕</button>
    </div>
    <div id="about-body"></div>
  </section>

  <section id="favs" class="sheet" hidden>
    <div class="sheet-head">
      <h2 id="favs-title"></h2>
      <button id="favs-close" class="pill" type="button">✕</button>
    </div>
    <div id="favs-body"></div>
  </section>

  <section id="incidents" class="sheet" hidden>
    <div class="sheet-head">
      <h2 id="inc-title"></h2>
      <button id="inc-close" class="pill" type="button">✕</button>
    </div>
    <div id="inc-body"></div>
  </section>

  <section id="near" class="sheet" hidden>
    <div class="sheet-head">
      <h2 id="near-title"></h2>
      <span class="head-actions">
        <button id="near-off" class="pill" type="button"></button>
        <button id="near-close" class="pill" type="button">✕</button>
      </span>
    </div>
    <p id="near-privacy" class="muted small"></p>
    <p id="near-status" class="small" aria-live="polite"></p>
    <div id="onboard"></div>
    <div id="near-body"></div>
  </section>

  <section id="delayed" class="sheet" hidden>
    <div class="sheet-head">
      <h2 id="delayed-title"></h2>
      <button id="delayed-close" class="pill" type="button">✕</button>
    </div>
    <ul id="delayed-list"></ul>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
