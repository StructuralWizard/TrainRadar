# TrainRadar ops: alerts to a Telegram chat every 5 minutes and the
# administrator dashboard at ops.mytrainradar.com, behind Cloudflare Access.
# Set-up: a Telegram bot made with @BotFather, its token in the repository
# secret ALERTS_TELEGRAM_BOT_TOKEN and your chat's id (after you message the
# bot once) in ALERTS_TELEGRAM_CHAT_ID; a Cloudflare Access application for
# ops.mytrainradar.com, whose team domain and audience tag go in
# ACCESS_TEAM_DOMAIN and ACCESS_AUD (repository variables or secrets); optionally
# PLAY_REPORTS_BUCKET; then OPS_ENABLED=true.
# It only reads: the live bucket's status files, the site's data manifests,
# Cloudflare's analytics (read-only token) and Google Play (read-only scopes).
# No secrets here: ALERTS_TELEGRAM_BOT_TOKEN, ALERTS_TELEGRAM_CHAT_ID,
# CLOUDFLARE_ANALYTICS_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON are Worker
# secrets, set by the deploy job from the GitHub Actions secrets.
name = "trainradar-ops"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "ops.mytrainradar.com", custom_domain = true }]

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "OPS"
class_name = "OpsState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpsState"]

[[r2_buckets]]
binding = "LIVE"
bucket_name = "trainradar-live"

[vars]
# Kill switch for the alerts (the dashboard works regardless).
OPS_ENABLED = "false"
SITE_URL = "https://mytrainradar.com/"
DASHBOARD_URL = "https://ops.mytrainradar.com/"
# The daily digest: one message with everything, at this hour in this zone.
DIGEST_TZ = "Europe/London"
DIGEST_HOUR = "21"
# Cloudflare Access (Zero Trust → Access → Applications → the app for
# ops.mytrainradar.com): the team domain and the application's audience tag.
# The deploy sets them from the repository variables of the same names.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Play's report bucket (Play Console → Download reports → Copy Cloud Storage
# URI), for installs and subscriptions by country; optional.
PLAY_REPORTS_BUCKET = ""
