// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        // Google's copy of Maven Central first: Central now and then hands
        // big files (the Kotlin compiler) to a download host that times out.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        // Google's copy of Maven Central first: Central now and then hands
        // big files (the Kotlin compiler) to a download host that times out.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    // Test libraries pull an old kotlin-stdlib-jdk7/jdk8 (1.6) next to
    // kotlin-stdlib 1.8, whose classes they duplicate; from 1.8 on those two
    // are empty, so align them.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                details.useVersion '1.8.22'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
