# Weekly: which cab-ride videos YouTube no longer serves (YouTube's public
# oEmbed address, no key; tools/cabrides/check.py). The list is saved in
# the Actions cache, where the deploy reads it to leave those videos out
# (docs/plan-cab-rides.md).
name: Cab-ride videos check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ask YouTube about every video
        run: |
          mkdir -p cabrides-gone
          python3 -I tools/cabrides/check.py refdata/cabrides/videos.csv cabrides-gone/gone.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the list for the deploy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cabrides-gone
          key: cabrides-gone-${{ github.run_id }}
