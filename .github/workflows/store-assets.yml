# Google Play graphics (phase C6): phone screenshots of the app on the live
# data and the feature graphic, as the "store-assets" artifact. Run by hand
# (Actions → Store assets → Run workflow) before a store listing update.
name: Store assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    name: screenshots and feature graphic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install wasm-bindgen-cli (version from Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: The app bundle with the live data
        env:
          LIVE_BASE: ${{ vars.LIVE_PUBLIC_URL }}
          API_BASE: ${{ vars.API_PUBLIC_URL }}
        run: tools/build-app.sh
      - name: Screenshots
        run: |
          (cd tools/feed-check && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          # Port 8080: an origin the live bucket and the API allow (CORS).
          (cd app/www && python3 -m http.server 8080 > /dev/null 2>&1 &)
          sleep 1
          mkdir -p store-assets
          node tools/feed-check/store-shots.mjs http://localhost:8080/ store-assets
      # Uploaded even if a later shot fails, so the finished ones are kept.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: store-assets
          path: store-assets
          retention-days: 30
