# Temporary probe: NAP API reachability, IDEAdif WFS contents, DEM access. Remove before merging.
name: Research (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/research.yml, tools/research/**]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/research/probe.sh
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
