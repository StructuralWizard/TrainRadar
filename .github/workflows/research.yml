# Temporary: read pages this project's sandbox can't reach. Remove before merging.
name: Research (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/research.yml, tools/research/**]
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cd tools/feed-check && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Peek
        run: |
          cp tools/research/peek.mjs tools/feed-check/
          cd tools/feed-check
          node peek.mjs https://nap.transportes.gob.es/licencia-datos nap || true
          node peek.mjs https://tiempo-real.renfe.com/ renfe || true
