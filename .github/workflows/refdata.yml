# Builds the reference data (.bin files) from Renfe's static GTFS and reports
# sizes. Runs on PRs that touch the builder, and manually.
name: Refdata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/proto/**
      - crates/refdata-build/**
      - tools/fetch-gtfs.sh
      - .github/workflows/refdata.yml
  push:
    branches-ignore: [main]
    paths:
      - crates/refdata-build/**
      - .github/workflows/refdata.yml

permissions:
  contents: read

concurrency:
  group: refdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p trainradar-refdata-build
      - name: Download Renfe GTFS
        run: tools/fetch-gtfs.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build .bin files
        run: |
          target/release/refdata-build build --out web/data \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip \
            --sources gtfs/sources.tsv --report refdata.md
      - name: Size report (raw and gzip -9)
        run: |
          command -v brotli >/dev/null || sudo apt-get install -y brotli
          {
            cat refdata.md
            echo
            echo "| File | Raw | gzip -9 | brotli -q 11 |"
            echo "|---|---:|---:|---:|"
            for f in web/data/*; do
              printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" "$(wc -c <"$f")" \
                "$(gzip -9c "$f" | wc -c)" "$(brotli -q 11 -c "$f" | wc -c)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: refdata
          path: web/data
          retention-days: 7
