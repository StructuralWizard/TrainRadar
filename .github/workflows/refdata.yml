# Builds the reference data (.bin files) from Renfe's static GTFS and reports
# sizes. Runs on PRs that touch the builder, and manually. (Not on every
# branch push too: a push plus its PR's run plus a manual run on the same
# branch kept cancelling each other.)
name: Refdata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/**
      - web/**
      - tools/**
      - .github/workflows/refdata.yml

permissions:
  contents: read

concurrency:
  group: refdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p trainradar-refdata-build
      - name: Download Renfe GTFS (and OUIGO from the NAP)
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: tools/fetch-gtfs.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Week number (OSM cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The rail network changes slowly: download from Geofabrik at most weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm
        with:
          path: gtfs/rail.geojsonseq
          key: osm-rail-v2-${{ steps.week.outputs.week }}
      - name: Download OpenStreetMap rail lines
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          tools/fetch-osm-rail.sh
      # Terrain heights for gradients: the rail nodes only change with the
      # OSM file, so sample the Copernicus DEM at most weekly too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dem
        with:
          path: gtfs/rail-heights.txt
          key: dem-heights-v1-${{ steps.week.outputs.week }}
      # The IGN API is slow and drops connections: fetch at most weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: igr
        with:
          path: gtfs/igr-rail.geojsonseq
          key: igr-rail-v1-${{ steps.week.outputs.week }}
      - name: Track count and electrification (IGN IGR-RT)
        if: steps.igr.outputs.cache-hit != 'true'
        continue-on-error: true # without it the build just lacks those facts
        run: python3 -I tools/fetch-igr-rail.py gtfs/igr-rail.geojsonseq
      - name: Terrain heights of the rail nodes (Copernicus DEM)
        if: steps.dem.outputs.cache-hit != 'true'
        continue-on-error: true # without heights the build just has no gradients
        run: |
          tools/fetch-dem-heights.sh
      - name: Build .bin files
        run: |
          target/release/refdata-build build --out web/data \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip --rail gtfs/rail.geojsonseq $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            $([ -s gtfs/rail-heights.txt ] && echo --rail-heights gtfs/rail-heights.txt) \
            $([ -s gtfs/igr-rail.geojsonseq ] && echo --rail-attrs gtfs/igr-rail.geojsonseq) \
            --stations gtfs/estaciones.geojson \
            --sources gtfs/sources.tsv --report refdata.md
      - name: Verify .bin files decode and are consistent
        run: target/release/refdata-build verify web/data
      - name: Track network validation (consecutive stops joined by track)
        continue-on-error: true # a report, not a gate: OSM gaps shouldn't stop the data
        run: |
          python3 -I tools/collect-renfe-ld.py gtfs/renfe-ld-pairs.tsv || true
          target/release/refdata-build validate-net --rail gtfs/rail.geojsonseq \
            --stations gtfs/estaciones.geojson --ld gtfs/ld.zip \
            $([ -s gtfs/renfe-ld-pairs.tsv ] && echo --pairs gtfs/renfe-ld-pairs.tsv) \
            --report validate-net.md --csv validate-net.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Live check (engine against current Renfe feeds)
        run: |
          mkdir -p gtfs/rt
          for f in vehicle_positions_LD trip_updates_LD vehicle_positions trip_updates alerts; do
            curl -fsSL --retry 3 -D "gtfs/rt/$f.headers" -o "gtfs/rt/$f.pb" "https://gtfsrt.renfe.com/$f.pb"
          done
          grep -i '^last-modified' gtfs/rt/alerts.headers || true
          cargo run --release -q -p trainradar-engine --example live_check -- web/data gtfs/rt \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Live web smoke test (real feeds via worker code, real map tiles)
        run: |
          cargo install wasm-bindgen-cli --locked --version "$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')"
          tools/build-web.sh
          (cd tools/feed-check && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          node tools/dev-server.mjs &
          sleep 1
          mkdir -p shots && node tools/feed-check/web-smoke.mjs http://localhost:8080/ shots --print-screenshot
          node tools/feed-check/readme-shot.mjs http://localhost:8080/ shots || echo "README screenshot failed (not fatal)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-screenshots
          path: shots
          retention-days: 7
      - name: Size report (raw and gzip -9)
        run: |
          command -v brotli >/dev/null || sudo apt-get install -y brotli
          {
            cat refdata.md
            echo
            echo "| File | Raw | gzip -9 | brotli -q 11 |"
            echo "|---|---:|---:|---:|"
            for f in web/data/*; do
              printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" "$(wc -c <"$f")" \
                "$(gzip -9c "$f" | wc -c)" "$(brotli -q 11 -c "$f" | wc -c)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refdata
          path: web/data
          retention-days: 7
