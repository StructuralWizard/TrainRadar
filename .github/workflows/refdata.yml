# Builds the reference data (.bin files) from Renfe's static GTFS and reports
# sizes. Runs on PRs that touch the builder, and manually. (Not on every
# branch push too: a push plus its PR's run plus a manual run on the same
# branch kept cancelling each other.)
name: Refdata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/**
      - web/**
      - tools/**
      - .github/workflows/refdata.yml

permissions:
  contents: read

concurrency:
  group: refdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p trainradar-refdata-build
      - name: Download Renfe GTFS (and OUIGO from the NAP)
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: tools/fetch-gtfs.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Week number (OSM cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The rail network changes slowly: download from Geofabrik at most weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm
        with:
          path: gtfs/rail.geojsonseq
          key: osm-rail-v2-${{ steps.week.outputs.week }}
          # A failed download falls back to the latest earlier week's file.
          restore-keys: osm-rail-v2-
      - name: Download OpenStreetMap rail lines
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          if ! timeout 25m tools/fetch-osm-rail.sh; then
            [ -s gtfs/rail.geojsonseq ] || exit 1
            echo "::warning::OSM download failed; building from an earlier week's rail lines"
          fi
      # Terrain heights for gradients: the rail nodes only change with the
      # OSM file, so sample the Copernicus DEM at most weekly too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dem
        with:
          path: gtfs/rail-heights.txt
          key: dem-heights-v2-${{ steps.week.outputs.week }}
      # The IGN API is slow and drops connections: fetch at most weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: igr
        with:
          path: gtfs/igr-rail.geojsonseq
          key: igr-rail-v1-${{ steps.week.outputs.week }}
      - name: Track count and electrification (IGN IGR-RT)
        if: steps.igr.outputs.cache-hit != 'true'
        continue-on-error: true # without it the build just lacks those facts
        run: python3 -I tools/fetch-igr-rail.py gtfs/igr-rail.geojsonseq
      - name: Terrain heights of the rail nodes (Copernicus DEM)
        if: steps.dem.outputs.cache-hit != 'true'
        continue-on-error: true # without heights the build just has no gradients
        run: |
          tools/fetch-dem-heights.sh
      - name: Build .bin files
        run: |
          target/release/refdata-build build --out web/data \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip --rail gtfs/rail.geojsonseq $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            $([ -s gtfs/rail-heights.txt ] && echo --rail-heights gtfs/rail-heights.txt) \
            $([ -s gtfs/igr-rail.geojsonseq ] && echo --rail-attrs gtfs/igr-rail.geojsonseq) \
            --stations gtfs/estaciones.geojson \
            --sources gtfs/sources.tsv --report refdata.md
      - name: Verify .bin files decode and are consistent
        run: target/release/refdata-build verify web/data
      - name: Plan-ahead timetables (63 days, sizes)
        run: |
          target/release/refdata-build build --out web/data-plan --gzip --days 63 \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            --report plan.md
          target/release/refdata-build verify web/data-plan
          { echo "## Plan-ahead timetables"; echo; cat plan.md; echo; jq -r '.regions[] | "- \(.code): until \(.until)"' web/data-plan/manifest.json; } >> "$GITHUB_STEP_SUMMARY"
      - name: Journeys with changes on the real timetables (timings)
        run: cargo run --release -q -p trainradar-engine --example journeys_bench -- web/data | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Journeys in the United Kingdom (the site's public data/uk/)
        continue-on-error: true # the site may be mid-deploy: a report, not a gate
        run: |
          uk=build/uk-site && mkdir -p "$uk"
          curl -fsS --retry 3 https://www.mytrainradar.com/data/uk/manifest.json -o "$uk/manifest.json"
          for f in $(jq -r '.stations.file, (.regions[] | .file)' "$uk/manifest.json"); do
            curl -fsS --retry 3 "https://www.mytrainradar.com/data/uk/$f" -o "$uk/$f"
            case "$f" in *.gz) gunzip -f "$uk/$f" ;; esac
          done
          jq '(.. | objects | select(has("file")) | .file) |= sub("\\.gz$"; "")' "$uk/manifest.json" > "$uk/m.json" && mv "$uk/m.json" "$uk/manifest.json"
          cargo run --release -q -p trainradar-engine --example journeys_bench -- "$uk" --uk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ireland (Irish Rail's timetable from the NTA; no key)
        continue-on-error: true # an outside download: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-ie.sh --no-osm
          target/release/refdata-build build --out build/ie --ie-gtfs gtfs/ie/GTFS_Irish_Rail.zip \
            --sources gtfs/ie/sources.tsv --report refdata-ie.md
          target/release/refdata-build verify build/ie
          { echo "## Ireland reference data"; echo; cat refdata-ie.md; } >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -q -p trainradar-engine --example journeys_bench -- build/ie --ie | tee -a "$GITHUB_STEP_SUMMARY"
      - name: France (SNCF's timetable; no key)
        continue-on-error: true # an outside download: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-fr.sh --no-osm
          target/release/refdata-build build --out build/fr --fr-gtfs gtfs/fr/sncf.zip \
            --sources gtfs/fr/sources.tsv --report refdata-fr.md
          target/release/refdata-build verify build/fr
          { echo "## France reference data"; echo; cat refdata-fr.md; } >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -q -p trainradar-engine --example journeys_bench -- build/fr --fr | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Luxembourg (CFL's trains from the national GTFS; no key)
        continue-on-error: true
        run: |
          set -o pipefail
          tools/fetch-lu.sh --no-osm
          target/release/refdata-build build --out build/lu --lu-gtfs gtfs/lu/gtfs.zip \
            --sources gtfs/lu/sources.tsv --report refdata-lu.md
          target/release/refdata-build verify build/lu
          { echo "## Luxembourg reference data"; echo; cat refdata-lu.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Finland (open timetable; no key)
        continue-on-error: true # an outside download: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-eu.sh fi --no-osm
          target/release/refdata-build build --out build/fi --fi-gtfs gtfs/fi/gtfs.zip \
            --sources gtfs/fi/sources.tsv --report refdata-fi.md
          target/release/refdata-build verify build/fi
          { echo "## Finland reference data"; echo; cat refdata-fi.md; } >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -q -p trainradar-engine --example journeys_bench -- build/fi --fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Norway (open timetable; no key)
        continue-on-error: true # an outside download: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-eu.sh no --no-osm
          target/release/refdata-build build --out build/no --no-gtfs gtfs/no/gtfs.zip \
            --sources gtfs/no/sources.tsv --report refdata-no.md
          target/release/refdata-build verify build/no
          { echo "## Norway reference data"; echo; cat refdata-no.md; } >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -q -p trainradar-engine --example journeys_bench -- build/no --no | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Netherlands (open timetable; no key)
        continue-on-error: true # an outside download: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-eu.sh nl --no-osm
          target/release/refdata-build build --out build/nl --nl-gtfs gtfs/nl/gtfs.zip \
            --sources gtfs/nl/sources.tsv --report refdata-nl.md
          target/release/refdata-build verify build/nl
          { echo "## Netherlands reference data"; echo; cat refdata-nl.md; } >> "$GITHUB_STEP_SUMMARY"
          cargo run --release -q -p trainradar-engine --example journeys_bench -- build/nl --nl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Slovakia (timetable only; no key)
        continue-on-error: true # an outside download: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-eu.sh sk --no-osm
          target/release/refdata-build build --out build/sk --sk-gtfs gtfs/sk/gtfs.zip \
            --sources gtfs/sk/sources.tsv --report refdata-sk.md
          target/release/refdata-build verify build/sk
          { echo "## Slovakia reference data"; echo; cat refdata-sk.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Estonia (timetable only; no key)
        continue-on-error: true # an outside download: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-eu.sh ee --no-osm
          target/release/refdata-build build --out build/ee --ee-gtfs gtfs/ee/gtfs.zip \
            --sources gtfs/ee/sources.tsv --report refdata-ee.md
          target/release/refdata-build verify build/ee
          { echo "## Estonia reference data"; echo; cat refdata-ee.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Switzerland (opentransportdata.swiss; timetable without key, live with CH_OTD_* keys)
        continue-on-error: true # outside services: a report, not a gate
        env:
          CH_OTD_GTFSRT_KEY: ${{ secrets.CH_OTD_GTFSRT_KEY }}
          CH_OTD_GTFSSA_KEY: ${{ secrets.CH_OTD_GTFSSA_KEY }}
          CH_OTD_GTFSSA_PLANNED_KEY: ${{ secrets.CH_OTD_GTFSSA_PLANNED_KEY }}
        run: |
          set -o pipefail
          tools/fetch-eu.sh ch --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/ch --ch-gtfs gtfs/ch/gtfs.zip \
            --sources gtfs/ch/sources.tsv --report refdata-ch.md
          target/release/refdata-build verify build/ch
          { echo "## Switzerland reference data"; echo; cat refdata-ch.md; } >> "$GITHUB_STEP_SUMMARY"
          unzip -p gtfs/ch/gtfs.zip trips.txt | python3 -I -c "import csv,sys; [print(r['trip_id']) for r in csv.DictReader(sys.stdin)]" > build/ch-trips.txt
          if [ -n "$CH_OTD_GTFSRT_KEY" ]; then
            echo "### ch: live probe" >> "$GITHUB_STEP_SUMMARY"
            node tools/feed-check/eu-probe.mjs ch build/ch-trips.txt build/probe-ch | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # GTFS Sweden 3's key allows 50 downloads a month: the deploy's copy
      # (one a day, cached) is used when there is one; tools/fetch-eu.sh.
      - name: Today's date
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: se_gtfs
        with:
          path: gtfs/se/sweden.zip
          key: se-gtfs-v1-${{ steps.day.outputs.day }}
          restore-keys: se-gtfs-v1-
      - name: Sweden (Trafiklab; SE_TRAFIKLAB_* keys, the key in its URL as Trafiklab requires)
        continue-on-error: true # outside services: a report, not a gate
        env:
          SE_GTFS_REUSE: ${{ steps.se_gtfs.outputs.cache-matched-key != '' && '1' || '' }}
          SE_TRAFIKLAB_STATIC_KEY: ${{ secrets.SE_TRAFIKLAB_STATIC_KEY }}
          SE_TRAFIKLAB_RT_KEY: ${{ secrets.SE_TRAFIKLAB_RT_KEY }}
          SE_TRAFIKVERKET_KEY: ${{ secrets.SE_TRAFIKVERKET_KEY }}
        run: |
          set -o pipefail
          if [ -z "$SE_TRAFIKLAB_STATIC_KEY" ]; then echo "Sweden (Trafiklab; SE_TRAFIKLAB_* keys, the key in its URL as Trafiklab requires): no SE_TRAFIKLAB_STATIC_KEY (a fork, or not set): skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p build
          # Without the timetable (GTFS Sweden 3's monthly quota spent), the
          # live sources are still probed, matched against nothing.
          : > build/se-trips.txt
          if tools/fetch-eu.sh se --no-osm | tee -a "$GITHUB_STEP_SUMMARY"; then
            target/release/refdata-build build --out build/se --se-gtfs gtfs/se/gtfs.zip \
              --sources gtfs/se/sources.tsv --report refdata-se.md
            target/release/refdata-build verify build/se
            { echo "## Sweden reference data"; echo; cat refdata-se.md; } >> "$GITHUB_STEP_SUMMARY"
            # Trip ids, and train numbers ("#1059") for Trafikverket's delays.
            unzip -p gtfs/se/gtfs.zip trips.txt | python3 -I -c "import csv,sys; [print(r['trip_id']) or (r.get('trip_short_name','').lstrip('0') and print('#'+r['trip_short_name'].lstrip('0'))) for r in csv.DictReader(sys.stdin)]" > build/se-trips.txt
            unzip -p gtfs/se/gtfs.zip trips.txt | head -3 | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "se: $(grep -c '^#' build/se-trips.txt) trips with a train number" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "se: no timetable (GTFS Sweden 3 not downloaded); the live sources only" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "### se: live probe" >> "$GITHUB_STEP_SUMMARY"
          node tools/feed-check/eu-probe.mjs se build/se-trips.txt build/probe-se | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Poland (PKP PLK's API; PL_PLK_API_KEY in a header)
        continue-on-error: true # outside services: a report, not a gate
        env:
          PL_PLK_API_KEY: ${{ secrets.PL_PLK_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$PL_PLK_API_KEY" ]; then echo "Poland (PKP PLK's API; PL_PLK_API_KEY in a header): no PL_PLK_API_KEY (a fork, or not set): skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          tools/fetch-eu.sh pl --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/pl --pl-gtfs gtfs/pl/gtfs.zip \
            --sources gtfs/pl/sources.tsv --report refdata-pl.md
          target/release/refdata-build verify build/pl
          { echo "## Poland reference data"; echo; cat refdata-pl.md; } >> "$GITHUB_STEP_SUMMARY"
          unzip -p gtfs/pl/gtfs.zip trips.txt | python3 -I -c "import csv,sys; [print(r['trip_id']) for r in csv.DictReader(sys.stdin)]" > build/pl-trips.txt
          echo "### pl: live probe" >> "$GITHUB_STEP_SUMMARY"
          node tools/feed-check/eu-probe.mjs pl build/pl-trips.txt build/probe-pl | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Austria (Mobilitätsverbünde Österreich; portal login AT_MVO_*)
        continue-on-error: true # outside services: a report, not a gate
        env:
          AT_MVO_USERNAME: ${{ secrets.AT_MVO_USERNAME }}
          AT_MVO_PASSWORD: ${{ secrets.AT_MVO_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$AT_MVO_USERNAME" ]; then echo "Austria: no AT_MVO_USERNAME (a fork, or not set): skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          tools/fetch-eu.sh at --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/at --at-gtfs gtfs/at/gtfs.zip \
            --sources gtfs/at/sources.tsv --report refdata-at.md
          target/release/refdata-build verify build/at
          { echo "## Austria reference data"; echo; cat refdata-at.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gtfs/cz/cisjr
          key: cisjr-v1-${{ github.run_id }}
          restore-keys: cisjr-v1-
      - name: Czechia (CIS JŘ, no key; stations from OSM)
        continue-on-error: true # outside services: a report, not a gate
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh cz --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/cz --cz-gtfs gtfs/cz/gtfs.zip \
            --sources gtfs/cz/sources.tsv --report refdata-cz.md
          target/release/refdata-build verify build/cz
          { echo "## Czechia reference data"; echo; cat refdata-cz.md; } >> "$GITHUB_STEP_SUMMARY"
          # Live (Golemio, no key): through the Worker's own code, and how
          # many PID trains' numbers the timetable has.
          unzip -p gtfs/cz/gtfs.zip trips.txt | python3 -I -c "import csv,sys; [print(r['trip_short_name']) for r in csv.DictReader(sys.stdin)]" > build/cz-numbers.txt
          echo "### cz: live probe" >> "$GITHUB_STEP_SUMMARY"
          node tools/feed-check/eu-probe.mjs cz build/cz-numbers.txt build/probe-cz | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Italy (Trenitalia on the national access point; Trenord for Lombardy; no key)
        continue-on-error: true # outside services: a report, not a gate
        run: |
          set -o pipefail
          tools/fetch-eu.sh it --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/it --it-gtfs gtfs/it/gtfs.zip \
            $([ -s gtfs/it/trenord.zip ] && echo --it-lom-gtfs gtfs/it/trenord.zip) \
            --sources gtfs/it/sources.tsv --report refdata-it.md
          target/release/refdata-build verify build/it
          { echo "## Italy reference data"; echo; cat refdata-it.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Denmark spike (Dataudveksleren, SIRI-ET over Azure Service Bus)
        continue-on-error: true # outside services: a report, not a gate
        env:
          DK_NAP_CLIENT_SECRET: ${{ secrets.DK_NAP_CLIENT_SECRET }}
        run: |
          set -o pipefail
          if [ -z "$DK_NAP_CLIENT_SECRET" ]; then echo "Denmark: no DK_NAP_CLIENT_SECRET (a fork, or not set): skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          (cd tools/dk && npm ci --no-audit --no-fund)
          node tools/dk/spike.mjs 785 10 samples/dk | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
          # The Worker's own receiver, every topic once (HTTPS, as deployed).
          echo "### dk: live probe" >> "$GITHUB_STEP_SUMMARY"
          node tools/feed-check/eu-probe.mjs dk /dev/null build/probe-dk | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
          # The planned timetable: Rejseplanen's NeTEx (dataset 242), trains.
          tools/fetch-eu.sh dk --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/dk --dk-gtfs gtfs/dk/gtfs.zip \
            --sources gtfs/dk/sources.tsv --report refdata-dk.md
          target/release/refdata-build verify build/dk
          { echo "## Denmark reference data"; echo; cat refdata-dk.md; } >> "$GITHUB_STEP_SUMMARY"
          # How many live trains' numbers the timetable has.
          unzip -p gtfs/dk/gtfs.zip trips.txt | python3 -I -c "import csv,sys; [print('#' + r['trip_short_name']) for r in csv.DictReader(sys.stdin) if r['trip_short_name']]" > build/dk-numbers.txt
          echo "### dk: live trains in the timetable" >> "$GITHUB_STEP_SUMMARY"
          node tools/feed-check/eu-probe.mjs dk build/dk-numbers.txt build/probe-dk2 | grep 'trip_updates' | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hungary (MÁV GTFS; login HU_MAV_*)
        continue-on-error: true # outside services: a report, not a gate
        env:
          HU_MAV_USERNAME: ${{ secrets.HU_MAV_USERNAME }}
          HU_MAV_PASSWORD: ${{ secrets.HU_MAV_PASSWORD }}
        run: |
          set -o pipefail
          if [ -z "$HU_MAV_USERNAME" ]; then echo "Hungary: no HU_MAV_USERNAME (a fork, or not set): skipped." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          tools/fetch-eu.sh hu --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/hu --hu-gtfs gtfs/hu/gtfs.zip \
            --sources gtfs/hu/sources.tsv --report refdata-hu.md
          target/release/refdata-build verify build/hu
          { echo "## Hungary reference data"; echo; cat refdata-hu.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Germany (DELFI GTFS; DB live probe with DE_DB_*)
        continue-on-error: true # outside services: a report, not a gate
        env:
          DE_DELFI_USERNAME: ${{ secrets.DE_DELFI_USERNAME }}
          DE_DELFI_PASSWORD: ${{ secrets.DE_DELFI_PASSWORD }}
          DE_DB_CLIENT_ID: ${{ secrets.DE_DB_CLIENT_ID }}
          DE_DB_API_KEY: ${{ secrets.DE_DB_API_KEY }}
          DE_MOBILITHEK_CERT_P12: ${{ secrets.DE_MOBILITHEK_CERT_P12 }}
          DE_MOBILITHEK_CERT_PASSWORD: ${{ secrets.DE_MOBILITHEK_CERT_PASSWORD }}
        run: |
          set -o pipefail
          # Which of DB's APIs the keys open (Timetables, OpenBoards).
          echo "### de: DB APIs" >> "$GITHUB_STEP_SUMMARY"
          node tools/de/db-probe.mjs samples/de | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
          tools/fetch-eu.sh de --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          target/release/refdata-build build --out build/de --de-gtfs gtfs/de/gtfs.zip \
            --sources gtfs/de/sources.tsv --report refdata-de.md
          target/release/refdata-build verify build/de
          { echo "## Germany reference data"; echo; cat refdata-de.md; } >> "$GITHUB_STEP_SUMMARY"
          # Live: OpenBoards through the Worker's own code, on the busiest
          # stations, and how many of its trains' numbers the timetable has.
          python3 -I tools/de/boards.py gtfs/de/gtfs.zip build/de-boards.txt | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -p gtfs/de/gtfs.zip trips.txt | python3 -I -c "import csv,sys; [print('#' + r['trip_short_name'].lstrip('0')) for r in csv.DictReader(sys.stdin) if r['trip_short_name'].strip('0')]" > build/de-numbers.txt
          echo "### de: live probe" >> "$GITHUB_STEP_SUMMARY"
          DE_BOARDS_FILE=build/de-boards.txt node tools/feed-check/eu-probe.mjs de build/de-numbers.txt build/probe-de | sed 's/$/  /' | tee -a "$GITHUB_STEP_SUMMARY"
