# Builds the reference data (.bin files) from Renfe's static GTFS and reports
# sizes. Runs on PRs that touch the builder, and manually.
name: Refdata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/proto/**
      - crates/refdata-build/**
      - tools/fetch-gtfs.sh
      - .github/workflows/refdata.yml
  push:
    branches-ignore: [main]
    paths:
      - crates/refdata-build/**
      - .github/workflows/refdata.yml

permissions:
  contents: read

concurrency:
  group: refdata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p trainradar-refdata-build
      - name: Download Renfe GTFS
        run: tools/fetch-gtfs.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sample realtime feeds (ids and fields, for trip matching)
        run: |
          for f in vehicle_positions vehicle_positions_LD trip_updates trip_updates_LD; do
            echo "== $f"
            curl -fsSL --retry 3 "https://gtfsrt.renfe.com/$f.json" -o "gtfs/$f.json"
            jq -c '{header, n: (.entity | length)}' "gtfs/$f.json"
            jq -c '.entity[:3][]' "gtfs/$f.json" | cut -c1-600
          done
      - name: Build .bin files
        run: |
          target/release/refdata-build build --out web/data \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip \
            --sources gtfs/sources.tsv --report refdata.md
      - name: Verify .bin files decode and are consistent
        run: target/release/refdata-build verify web/data
      - name: Size report (raw and gzip -9)
        run: |
          command -v brotli >/dev/null || sudo apt-get install -y brotli
          {
            cat refdata.md
            echo
            echo "| File | Raw | gzip -9 | brotli -q 11 |"
            echo "|---|---:|---:|---:|"
            for f in web/data/*; do
              printf '| `%s` | %s | %s | %s |\n' "$(basename "$f")" "$(wc -c <"$f")" \
                "$(gzip -9c "$f" | wc -c)" "$(brotli -q 11 -c "$f" | wc -c)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refdata
          path: web/data
          retention-days: 7
