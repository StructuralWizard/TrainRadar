      # Transport), one build, timetables need no key; OSM track from
      # Geofabrik's New Zealand. By timetable for now.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.NZ_WLG_ENABLED == 'true' || vars.NZ_AKL_ENABLED == 'true'
        id: osm_nz
        with:
          path: gtfs/nz-osm/rail.geojsonseq
          key: osm-rail-nz-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-nz-v1-
      - name: New Zealand reference data
        if: vars.NZ_WLG_ENABLED == 'true' || vars.NZ_AKL_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_nz.outputs.cache-hit }}
          WLG: ${{ vars.NZ_WLG_ENABLED }}
          AKL: ${{ vars.NZ_AKL_ENABLED }}
        run: |
          set -o pipefail
          args=()
          if [ "$WLG" = "true" ]; then tools/fetch-eu.sh nz-wlg --no-osm | tee -a "$GITHUB_STEP_SUMMARY" && args+=(--nz-wlg-gtfs gtfs/nz-wlg/gtfs.zip); fi
          if [ "$AKL" = "true" ]; then tools/fetch-eu.sh nz-akl --no-osm | tee -a "$GITHUB_STEP_SUMMARY" && args+=(--nz-akl-gtfs gtfs/nz-akl/gtfs.zip); fi
          [ ${#args[@]} -gt 0 ] || { echo "::warning::New Zealand: no region's timetable downloaded: deploying without New Zealand."; exit 1; }
          cat gtfs/nz-wlg/sources.tsv gtfs/nz-akl/sources.tsv 2>/dev/null > gtfs/nz-sources.tsv || true
          # The track: New Zealand's OSM extract once, for both regions.
          if [ ! -s gtfs/nz-osm/rail.geojsonseq ]; then
            [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
            tools/fetch-eu.sh nz-osm | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/nz-data --gzip "${args[@]}" --sources gtfs/nz-sources.tsv \
              $([ -s gtfs/nz-osm/rail.geojsonseq ] && echo --rail gtfs/nz-osm/rail.geojsonseq) --report refdata-nz.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/nz-data; then
            mv build/nz-data build/data/nz
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/nz-plan --gzip --days 63 \
                "${args[@]}" --report nz-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/nz-plan; then
              mv build/nz-plan build/data/nz/plan
            else
              echo "::warning::New Zealand's plan-ahead timetables failed: it has today's week only."
            fi
            { echo "## New Zealand reference data"; echo; cat refdata-nz.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::New Zealand's reference data failed: deploying without New Zealand."
            exit 1
          fi

      # Singapore → data/sg/, with SG_ENABLED: the MRT and LRT, an estimated
      # timetable from OpenStreetMap's routes and tools/sg/lines.tsv (LTA
      # publishes none); no key. The track is in it (the routes' ways).
      - name: Singapore reference data
        if: vars.SG_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh sg --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/sg-data --gzip --sg-gtfs gtfs/sg/gtfs.zip \
              --sources gtfs/sg/sources.tsv --report refdata-sg.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/sg-data; then
            mv build/sg-data build/data/sg
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/sg-plan --gzip --days 63 \
                --sg-gtfs gtfs/sg/gtfs.zip --report sg-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/sg-plan; then
              mv build/sg-plan build/data/sg/plan
            else
              echo "::warning::Singapore's plan-ahead timetables failed: it has today's week only."
            fi
            { echo "## Singapore reference data (estimated)"; echo; cat refdata-sg.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Singapore's reference data failed: deploying without Singapore."
            exit 1
          fi

      # Portugal → data/pt/, with PT_ENABLED: Lisbon (Fertagus and Lisbon
      # Metro, open licences, no key) and CP's national timetable (published
      # for anyone at publico.cp.pt, no licence stated; credited, no logo, no
      # endorsement implied), by timetable (no live data published). CP is
      # built unless PT_CP_ENABLED is "false": the switch if CP objects
      # (docs/europe/pt.md).
      - name: Portugal reference data
        if: vars.PT_ENABLED == 'true'
        continue-on-error: true
        env:
          PT_CP: ${{ vars.PT_CP_ENABLED != 'false' && '1' || '' }}
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh pt-lis | tee -a "$GITHUB_STEP_SUMMARY"
          args=(--pt-lis-gtfs gtfs/pt-lis/gtfs.zip)
          if [ "$PT_CP" = "1" ] && tools/fetch-eu.sh pt --no-osm | tee -a "$GITHUB_STEP_SUMMARY"; then
            args+=(--pt-gtfs gtfs/pt/gtfs.zip)
            cat gtfs/pt/sources.tsv >> gtfs/pt-lis/sources.tsv
          fi
          rail=(); [ -s gtfs/pt-lis/rail.geojsonseq ] && rail=(--rail gtfs/pt-lis/rail.geojsonseq)
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/pt-data --gzip "${args[@]}" "${rail[@]}" \
              --sources gtfs/pt-lis/sources.tsv --report refdata-pt.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/pt-data; then
            mv build/pt-data build/data/pt
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/pt-plan --gzip --days 63 "${args[@]}" --report pt-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/pt-plan; then
              mv build/pt-plan build/data/pt/plan
            else
              echo "::warning::Portugal's plan-ahead timetables failed: it has today's week only."
            fi
            { echo "## Portugal reference data"; echo; cat refdata-pt.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Portugal's reference data failed: deploying without Portugal."
            exit 1
          fi

      # Japan → data/jp/, with JP_ENABLED: Tokyo (Toei's subway, tram and
      # Nippori-Toneri Liner) and Kōchi (Tosaden's trams), CC BY 4.0 from
      # ODPT's public API, no key; Toei's live data with JP_LIVE_ENABLED.
      - name: Japan reference data
        if: vars.JP_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          tools/fetch-eu.sh jp-tyo --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          tools/fetch-eu.sh jp-kch --no-osm | tee -a "$GITHUB_STEP_SUMMARY"
          cat gtfs/jp-kch/sources.tsv >> gtfs/jp-tyo/sources.tsv
          args=(--jp-tyo-gtfs gtfs/jp-tyo/gtfs.zip --jp-kch-gtfs gtfs/jp-kch/gtfs.zip)
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/jp-data --gzip "${args[@]}" \
              --sources gtfs/jp-tyo/sources.tsv --report refdata-jp.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/jp-data; then
            mv build/jp-data build/data/jp
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/jp-plan --gzip --days 63 "${args[@]}" --report jp-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/jp-plan; then
              mv build/jp-plan build/data/jp/plan
            else
              echo "::warning::Japan's plan-ahead timetables failed: it has today's week only."
            fi
            { echo "## Japan reference data"; echo; cat refdata-jp.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Japan's reference data failed: deploying without Japan."
            exit 1
          fi

      # Estonia (M4), with EE_ENABLED: timetable only (no key) → data/ee/.
      - name: Estonia reference data
        if: vars.EE_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh ee | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/ee-data --gzip \
              --ee-gtfs gtfs/ee/gtfs.zip --sources gtfs/ee/sources.tsv \
              $([ -s gtfs/ee/rail.geojsonseq ] && echo --rail gtfs/ee/rail.geojsonseq) --report refdata-ee.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/ee-data; then
            mv build/ee-data build/data/ee
            { echo "## Estonia reference data"; echo; cat refdata-ee.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Estonia's reference data failed: deploying without Estonia."
            exit 1
          fi

      # Czechia, with CZ_ENABLED: CIS JŘ's national timetable (NeTEx, minus the
      # CZPTT cancellations), no key; stations and track from OSM (weekly)
      # → data/cz/ (cz long distance, cz-r regional), by timetable. The
      # portal's files are cached: a day's run fetches only the new ones.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.CZ_ENABLED == 'true'
        id: osm_cz
        with:
          path: |
            gtfs/cz/rail.geojsonseq
            gtfs/cz/stations.geojsonseq
          key: osm-rail-cz-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-cz-v1-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.CZ_ENABLED == 'true'
        with:
          path: gtfs/cz/cisjr
          key: cisjr-v1-${{ github.run_id }}
          restore-keys: cisjr-v1-
      - name: Czechia reference data
        if: vars.CZ_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_cz.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh cz | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/cz-data --gzip \
              --cz-gtfs gtfs/cz/gtfs.zip --sources gtfs/cz/sources.tsv \
              $([ -s gtfs/cz/rail.geojsonseq ] && echo --rail gtfs/cz/rail.geojsonseq) --report refdata-cz.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/cz-data; then
            mv build/cz-data build/data/cz
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/cz-plan --gzip --days 63 \
                --cz-gtfs gtfs/cz/gtfs.zip --report cz-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/cz-plan; then
              mv build/cz-plan build/data/cz/plan
            else
              echo "::warning::Czechia's plan-ahead timetables failed: Czechia has today's week only."
            fi
            { echo "## Czechia reference data"; echo; cat refdata-cz.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Czechia's reference data failed: deploying without Czechia."
            exit 1
          fi

      - name: Cloudflare names
        id: urls
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -H "$auth" "$api/pages/projects/$PAGES_PROJECT" >/dev/null; then
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch main
          fi
          pages=$(curl -fsS -H "$auth" "$api/pages/projects/$PAGES_PROJECT" | jq -r '.result.subdomain')
          workers=$(curl -fsS -H "$auth" "$api/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$workers" ]; then
            echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to create it."
            exit 1
          fi
          echo "site=https://$pages" >> "$GITHUB_OUTPUT"
          echo "proxy=https://trainradar-proxy.$workers.workers.dev/" >> "$GITHUB_OUTPUT"

      - name: Deploy the Worker (CORS pass-through)
        env:
          SITE: ${{ steps.urls.outputs.site }}
        # The Pages address and the custom domain (docs/deploy.md).
        run: npx --yes "$WRANGLER" deploy --config worker/wrangler.toml --var "ALLOWED_ORIGINS:$SITE,https://mytrainradar.com,https://www.mytrainradar.com"

      - name: Install wasm-bindgen-cli (version from Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
          sudo apt-get install -y binaryen
      # The website's world view: every country's summary (stations, lines,
      # trains by half hour, a coarse network) in one data/world.json.
      - name: World summary
        continue-on-error: true
        run: node tools/world/build.mjs build/data | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the site
        env:
          RT_BASE: ${{ steps.urls.outputs.proxy }}
          # Public URL of the central poller's bucket (custom domain). Empty:
          # the site stays on the pass-through. See docs/deploy.md.
          LIVE_BASE: ${{ vars.LIVE_PUBLIC_URL }}
          API_BASE: ${{ vars.API_PUBLIC_URL }}
          DIST: dist
          DATA_DIR: build/data
          VERSION: ${{ github.sha }}
        run: APP_VERSION="web-${GITHUB_SHA::7}" tools/build-web.sh
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name "$PAGES_PROJECT" \
            --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      # Tell Bing (which feeds ChatGPT search and Copilot), Yandex and other
      # IndexNow engines that the pages changed, so they recrawl in hours,
      # not weeks. The key file is public by design. docs/seo.md.
      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          key=$(basename "$(ls web/[0-9a-f]*[0-9a-f].txt)" .txt)
          urls=$(grep -o '<loc>[^<]*</loc>' web/sitemap.xml | sed 's#</\?loc>##g' | jq -R . | jq -s .)
          jq -n --arg key "$key" --argjson urls "$urls" \
            '{host: "mytrainradar.com", key: $key, keyLocation: "https://mytrainradar.com/\($key).txt", urlList: $urls}' \
            | curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
                -H "Content-Type: application/json; charset=utf-8" --data-binary @- | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live site
        env:
          SITE: ${{ steps.urls.outputs.site }}
        run: |
          (cd tools/feed-check && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          sleep 20 # let the deployment propagate
          # Every other country deployed opens from its ?country= link too.
          COUNTRIES=$(for m in dist/data/*/manifest.json; do [ -f "$m" ] && basename "$(dirname "$m")"; done | grep -vx plan | tr '\n' ' ' || true)
          export COUNTRIES
          mkdir -p shots && node tools/feed-check/web-smoke.mjs "$SITE/" shots | tee smoke.txt
          echo "Live: $SITE" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(stats|OK|country)" smoke.txt | sed 's/$/  /' >> "$GITHUB_STEP_SUMMARY" || true
          if grep -q "^country .*: FAIL" smoke.txt; then echo "::warning::A country did not open from its link: see the summary."; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-site-screenshots
          path: shots
          retention-days: 14

  uk:
    # UK ingest (backend-uk/, plan 3): drains Network Rail's TRUST feed every
    # minute into uk/rt/ in the live bucket. Off until the maintainer sets the
    # variable UK_ENABLED=true; uses the Network Rail login secrets.
    name: deploy the UK ingest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Is the UK ingest enabled, and did it change?
        id: gate
        env:
          UK_ENABLED: ${{ vars.UK_ENABLED }}
          EVENT: ${{ github.event_name }}
        run: |
          norm() { printf %s "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }
          if [ "$(norm "$UK_ENABLED")" != "true" ]; then
            echo "UK_ENABLED is not true: skipping the UK ingest." | tee -a "$GITHUB_STEP_SUMMARY"
          # A redeploy restarts the Worker, possibly in the middle of a drain,
          # and Network Rail's broker then refuses our client-id for a while
          # (AMQ339009). So a merge redeploys it only when backend-uk/ changed;
          # Run workflow always does.
          elif [ "$EVENT" = "push" ] && git diff --quiet HEAD^ HEAD -- backend-uk/; then
            echo "backend-uk/ unchanged: the UK ingest keeps running as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      - run: node --test backend-uk/test/*.test.mjs
        if: steps.gate.outputs.on == 'true'
      - name: Deploy the UK ingest Worker
        if: steps.gate.outputs.on == 'true'
        env:
          NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
          NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
          NATIONAL_RAIL_KB_KEY: ${{ secrets.NATIONAL_RAIL_KB_KEY }}
        run: |
          npx --yes "$WRANGLER" deploy --config backend-uk/wrangler.toml --var "UK_ENABLED:true"
          # Secrets on stdin, never on the command line.
          printf '%s' "$NETWORK_RAIL_USERNAME" | npx --yes "$WRANGLER" secret put NETWORK_RAIL_USERNAME --config backend-uk/wrangler.toml
          printf '%s' "$NETWORK_RAIL_PASSWORD" | npx --yes "$WRANGLER" secret put NETWORK_RAIL_PASSWORD --config backend-uk/wrangler.toml
          # National Rail incidents (Rail Data Marketplace), when the key is set.
          if [ -n "$NATIONAL_RAIL_KB_KEY" ]; then
            printf '%s' "$NATIONAL_RAIL_KB_KEY" | npx --yes "$WRANGLER" secret put NATIONAL_RAIL_KB_KEY --config backend-uk/wrangler.toml
          fi
          echo "UK ingest deployed: its status is uk/rt/status.json on the live domain." >> "$GITHUB_STEP_SUMMARY"

  eu:
    # Europe ingest (backend-eu/, docs/plan-europe.md A5): Ireland's live
    # feed from the NTA, with IE_ENABLED=true and the IE_NTA_API_KEY secret;
    # France's SNCF feeds with FR_ENABLED=true; Finland, Norway and the
    # Netherlands with FI_, NO_ and NL_ENABLED=true (no keys).
    name: deploy the Europe ingest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Is the Europe ingest enabled, and did it change?
        id: gate
        env:
          IE_ENABLED: ${{ vars.IE_ENABLED }}
          FR_ENABLED: ${{ vars.FR_ENABLED }}
          FI_ENABLED: ${{ vars.FI_ENABLED }}
          NO_ENABLED: ${{ vars.NO_ENABLED }}
          NL_ENABLED: ${{ vars.NL_ENABLED }}
          CH_ENABLED: ${{ vars.CH_ENABLED }}
          PL_ENABLED: ${{ vars.PL_ENABLED }}
          # Sweden's live data has its own switch: it needs Trafiklab's Silver
          # level, the timetable (SE_ENABLED) doesn't.
          SE_LIVE_ENABLED: ${{ vars.SE_LIVE_ENABLED }}
          # Czechia's live data (Golemio, no key) too: its own switch, apart
          # from the timetable (CZ_ENABLED).
          CZ_LIVE_ENABLED: ${{ vars.CZ_LIVE_ENABLED }}
          # Denmark (Rejseplanen's SIRI-ET, the national access point): live
          # only for now, with its service account's secret.
          DK_LIVE_ENABLED: ${{ vars.DK_LIVE_ENABLED }}
          HAS_DK_KEY: ${{ secrets.DK_NAP_CLIENT_SECRET != '' }}
          # Germany (DB's OpenBoards): live, its own switch, with DB's keys.
          DE_LIVE_ENABLED: ${{ vars.DE_LIVE_ENABLED }}
          HAS_DE_KEY: ${{ secrets.DE_DB_CLIENT_ID != '' && secrets.DE_DB_API_KEY != '' }}
          # Belgium (SNCB's GTFS-Realtime): live, its own switch, with the key.
          BE_LIVE_ENABLED: ${{ vars.BE_LIVE_ENABLED }}
          HAS_BE_KEY: ${{ secrets.BE_SNCB_KEY != '' }}
          # New South Wales (Transport for NSW): live, its own switch, with the key.
          AU_NSW_LIVE_ENABLED: ${{ vars.AU_NSW_LIVE_ENABLED }}
          HAS_AU_KEY: ${{ secrets.AU_NSW_API_KEY != '' }}
          # Victoria (Transport Victoria): in New South Wales' Worker part,
          # its own switch, with its key.
          AU_VIC_LIVE_ENABLED: ${{ vars.AU_VIC_LIVE_ENABLED }}
          HAS_VIC_KEY: ${{ secrets.AU_VIC_API_KEY != '' }}
          # New Zealand (Metlink and Auckland Transport): live, its own
          # switch, with both keys.
          NZ_LIVE_ENABLED: ${{ vars.NZ_LIVE_ENABLED }}
          HAS_NZ_KEY: ${{ secrets.NZ_METLINK_API_KEY != '' && secrets.NZ_AT_API_KEY != '' }}
          # Singapore (LTA DataMall's train alerts): its own switch, with the key.
          SG_LIVE_ENABLED: ${{ vars.SG_LIVE_ENABLED }}
          HAS_SG_KEY: ${{ secrets.SG_LTA_ACCOUNT_KEY != '' }}
          # Japan (Toei, ODPT's public API): no key; its own switch.
          JP_LIVE_ENABLED: ${{ vars.JP_LIVE_ENABLED }}
          HAS_KEY: ${{ secrets.IE_NTA_API_KEY != '' }}
          HAS_CH_KEY: ${{ secrets.CH_OTD_GTFSRT_KEY != '' }}
          HAS_PL_KEY: ${{ secrets.PL_PLK_API_KEY != '' }}
          HAS_SE_KEY: ${{ secrets.SE_TRAFIKLAB_RT_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          norm() { printf %s "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }
          # Ireland needs its key too; the others need no key.
          on() { [ "$(norm "$1")" = "true" ] && echo true || echo false; }
          ie=false
          if [ "$(norm "$IE_ENABLED")" = "true" ] && [ "$HAS_KEY" = "true" ]; then ie=true; fi
          fr=$(on "$FR_ENABLED"); fi_=$(on "$FI_ENABLED"); no=$(on "$NO_ENABLED"); nl=$(on "$NL_ENABLED")
          # Switzerland and Poland need their keys too.
          ch=false; pl=false; se=false
          if [ "$(on "$CH_ENABLED")" = "true" ] && [ "$HAS_CH_KEY" = "true" ]; then ch=true; fi
          if [ "$(on "$PL_ENABLED")" = "true" ] && [ "$HAS_PL_KEY" = "true" ]; then pl=true; fi
          if [ "$(on "$SE_LIVE_ENABLED")" = "true" ] && [ "$HAS_SE_KEY" = "true" ]; then se=true; fi
          cz=$(on "$CZ_LIVE_ENABLED")
          dk=false
          if [ "$(on "$DK_LIVE_ENABLED")" = "true" ] && [ "$HAS_DK_KEY" = "true" ]; then dk=true; fi
          de=false
          if [ "$(on "$DE_LIVE_ENABLED")" = "true" ] && [ "$HAS_DE_KEY" = "true" ]; then de=true; fi
          be=false
          if [ "$(on "$BE_LIVE_ENABLED")" = "true" ] && [ "$HAS_BE_KEY" = "true" ]; then be=true; fi
          au=false
          if [ "$(on "$AU_NSW_LIVE_ENABLED")" = "true" ] && [ "$HAS_AU_KEY" = "true" ]; then au=true; fi
          vic=false
          if [ "$au" = "true" ] && [ "$(on "$AU_VIC_LIVE_ENABLED")" = "true" ] && [ "$HAS_VIC_KEY" = "true" ]; then vic=true; fi
          nz=false
          if [ "$(on "$NZ_LIVE_ENABLED")" = "true" ] && [ "$HAS_NZ_KEY" = "true" ]; then nz=true; fi
          sg=false
          if [ "$(on "$SG_LIVE_ENABLED")" = "true" ] && [ "$HAS_SG_KEY" = "true" ]; then sg=true; fi
          jp=false
          if [ "$(on "$JP_LIVE_ENABLED")" = "true" ]; then jp=true; fi
          { echo "jp=$jp"; echo "ie=$ie"; echo "fr=$fr"; echo "fi=$fi_"; echo "no=$no"; echo "nl=$nl"; echo "ch=$ch"; echo "pl=$pl"; echo "se=$se"; echo "cz=$cz"; echo "dk=$dk"; echo "de=$de"; echo "be=$be"; echo "au=$au"; echo "vic=$vic"; echo "nz=$nz"; echo "sg=$sg"; } >> "$GITHUB_OUTPUT"
          if [ "$ie$fr$fi_$no$nl$ch$pl$se$cz$dk$de$be$au$nz$sg$jp" = "falsefalsefalsefalsefalsefalsefalsefalsefalsefalsefalsefalsefalsefalsefalsefalse" ]; then
            echo "No Europe country is on (IE_ENABLED with IE_NTA_API_KEY, FR_, FI_, NO_, NL_ENABLED, CH_, PL_ENABLED or SE_LIVE_ENABLED with their keys, CZ_LIVE_ENABLED, DK_LIVE_ENABLED with DK_NAP_CLIENT_SECRET, DE_LIVE_ENABLED with DE_DB_*, BE_LIVE_ENABLED with BE_SNCB_KEY, AU_NSW_LIVE_ENABLED with AU_NSW_API_KEY, NZ_LIVE_ENABLED with NZ_METLINK_API_KEY and NZ_AT_API_KEY, SG_LIVE_ENABLED with SG_LTA_ACCOUNT_KEY, JP_LIVE_ENABLED): skipping the Europe ingest." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT" = "push" ] && git diff --quiet HEAD^ HEAD -- backend-eu/; then
            echo "backend-eu/ unchanged: the Europe ingest keeps running as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      - run: node --test backend-eu/test/*.test.mjs
        if: steps.gate.outputs.on == 'true'
      - name: Deploy the Europe ingest Worker
        if: steps.gate.outputs.on == 'true'
        env:
          IE_NTA_API_KEY: ${{ secrets.IE_NTA_API_KEY }}
          IE_ON: ${{ steps.gate.outputs.ie }}
          FR_ON: ${{ steps.gate.outputs.fr }}
          FI_ON: ${{ steps.gate.outputs.fi }}
          NO_ON: ${{ steps.gate.outputs.no }}
          NL_ON: ${{ steps.gate.outputs.nl }}
          CH_ON: ${{ steps.gate.outputs.ch }}
          PL_ON: ${{ steps.gate.outputs.pl }}
          SE_ON: ${{ steps.gate.outputs.se }}
          CZ_ON: ${{ steps.gate.outputs.cz }}
          DK_ON: ${{ steps.gate.outputs.dk }}
          DK_NAP_CLIENT_SECRET: ${{ secrets.DK_NAP_CLIENT_SECRET }}
          DE_ON: ${{ steps.gate.outputs.de }}
          DE_DB_CLIENT_ID: ${{ secrets.DE_DB_CLIENT_ID }}
          DE_DB_API_KEY: ${{ secrets.DE_DB_API_KEY }}
          BE_ON: ${{ steps.gate.outputs.be }}
          BE_SNCB_KEY: ${{ secrets.BE_SNCB_KEY }}
          AU_ON: ${{ steps.gate.outputs.au }}
          AU_NSW_API_KEY: ${{ secrets.AU_NSW_API_KEY }}
          VIC_ON: ${{ steps.gate.outputs.vic }}
          AU_VIC_API_KEY: ${{ secrets.AU_VIC_API_KEY }}
          NZ_ON: ${{ steps.gate.outputs.nz }}
          NZ_METLINK_API_KEY: ${{ secrets.NZ_METLINK_API_KEY }}
          NZ_AT_API_KEY: ${{ secrets.NZ_AT_API_KEY }}
          SG_ON: ${{ steps.gate.outputs.sg }}
          JP_ON: ${{ steps.gate.outputs.jp }}
          SG_LTA_ACCOUNT_KEY: ${{ secrets.SG_LTA_ACCOUNT_KEY }}
          SE_TRAFIKLAB_RT_KEY: ${{ secrets.SE_TRAFIKLAB_RT_KEY }}
          SE_TRAFIKVERKET_KEY: ${{ secrets.SE_TRAFIKVERKET_KEY }}
          CH_OTD_GTFSRT_KEY: ${{ secrets.CH_OTD_GTFSRT_KEY }}
          CH_OTD_GTFSSA_KEY: ${{ secrets.CH_OTD_GTFSSA_KEY }}
          CH_OTD_GTFSSA_PLANNED_KEY: ${{ secrets.CH_OTD_GTFSSA_PLANNED_KEY }}
          PL_PLK_API_KEY: ${{ secrets.PL_PLK_API_KEY }}
        run: |
          npx --yes "$WRANGLER" deploy --config backend-eu/wrangler.toml --var "IE_ENABLED:$IE_ON" --var "FR_ENABLED:$FR_ON" \
            --var "FI_ENABLED:$FI_ON" --var "NO_ENABLED:$NO_ON" --var "NL_ENABLED:$NL_ON" \
            --var "CH_ENABLED:$CH_ON" --var "PL_ENABLED:$PL_ON" --var "SE_ENABLED:$SE_ON" \
            --var "CZ_ENABLED:$CZ_ON" --var "DK_ENABLED:$DK_ON" --var "DE_ENABLED:$DE_ON" --var "BE_ENABLED:$BE_ON" --var "AU_ENABLED:$AU_ON" \
            --var "NZ_ENABLED:$NZ_ON" --var "SG_ENABLED:$SG_ON" --var "JP_ENABLED:$JP_ON" --var "AU_VIC_LIVE:$VIC_ON"
          # Keys on stdin, never on the command line.
          put() { [ -n "$2" ] && printf '%s' "$2" | npx --yes "$WRANGLER" secret put "$1" --config backend-eu/wrangler.toml; }
          if [ "$IE_ON" = "true" ]; then put IE_NTA_API_KEY "$IE_NTA_API_KEY"; fi
          if [ "$CH_ON" = "true" ]; then
            put CH_OTD_GTFSRT_KEY "$CH_OTD_GTFSRT_KEY"
            put CH_OTD_GTFSSA_KEY "$CH_OTD_GTFSSA_KEY" || true
            put CH_OTD_GTFSSA_PLANNED_KEY "$CH_OTD_GTFSSA_PLANNED_KEY" || true
          fi
          if [ "$PL_ON" = "true" ]; then put PL_PLK_API_KEY "$PL_PLK_API_KEY"; fi
          if [ "$SE_ON" = "true" ]; then put SE_TRAFIKLAB_RT_KEY "$SE_TRAFIKLAB_RT_KEY"; fi
          # Trafikverket (every train's delay, and its messages): optional.
          if [ "$SE_ON" = "true" ] && [ -n "$SE_TRAFIKVERKET_KEY" ]; then put SE_TRAFIKVERKET_KEY "$SE_TRAFIKVERKET_KEY"; fi
          if [ "$DK_ON" = "true" ]; then put DK_NAP_CLIENT_SECRET "$DK_NAP_CLIENT_SECRET"; fi
          if [ "$DE_ON" = "true" ]; then
            put DE_DB_CLIENT_ID "$DE_DB_CLIENT_ID"
            put DE_DB_API_KEY "$DE_DB_API_KEY"
          fi
          if [ "$BE_ON" = "true" ]; then put BE_SNCB_KEY "$BE_SNCB_KEY"; fi
          if [ "$AU_ON" = "true" ]; then put AU_NSW_API_KEY "$AU_NSW_API_KEY"; fi
          if [ "$VIC_ON" = "true" ]; then put AU_VIC_API_KEY "$AU_VIC_API_KEY"; fi
          if [ "$NZ_ON" = "true" ]; then
            put NZ_METLINK_API_KEY "$NZ_METLINK_API_KEY"
            put NZ_AT_API_KEY "$NZ_AT_API_KEY"
          fi
          if [ "$SG_ON" = "true" ]; then put SG_LTA_ACCOUNT_KEY "$SG_LTA_ACCOUNT_KEY"; fi
          echo "Europe ingest deployed (Ireland: $IE_ON, France: $FR_ON, Finland: $FI_ON, Norway: $NO_ON, Netherlands: $NL_ON, Switzerland: $CH_ON, Poland: $PL_ON, Sweden: $SE_ON, Czechia: $CZ_ON, Denmark: $DK_ON, Germany: $DE_ON, Belgium: $BE_ON, New South Wales: $AU_ON, Victoria: $VIC_ON, New Zealand: $NZ_ON, Singapore: $SG_ON, Japan: $JP_ON); each country's status is <country>/rt/status.json on the live domain." >> "$GITHUB_STEP_SUMMARY"

  live:
    # Central poller and history recorder (backend/): Renfe fetched once for
    # everyone, bytes in R2; delays recorded to D1. Off until the maintainer
    # sets the variable LIVE_ENABLED=true (the API token needs R2 rights
    # first: docs/deploy.md). The recorder stays off until RECORDER_ENABLED
    # is also true (needs Workers Paid and D1 rights).
    name: deploy the live poller
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Read here, not in the job's `if`: a variable set on the "production"
      # environment is only visible once the job is running in it.
      - name: Are the live poller and the recorder enabled?
        id: gate
        env:
          LIVE_ENABLED: ${{ vars.LIVE_ENABLED }}
          RECORDER_ENABLED: ${{ vars.RECORDER_ENABLED }}
        run: |
          norm() { printf %s "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }
          if [ "$(norm "$LIVE_ENABLED")" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_ENABLED is not true: skipping the live poller." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(norm "$RECORDER_ENABLED")" = "true" ]; then
            echo "recorder=true" >> "$GITHUB_OUTPUT"
          else
            echo "RECORDER_ENABLED is not true: the history recorder stays off." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.on == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      # The recorder runs the app's engine: build it (web/pkg).
      - run: rustup show active-toolchain || rustup toolchain install
        if: steps.gate.outputs.on == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.gate.outputs.on == 'true'
      - name: Build the engine (WebAssembly)
        if: steps.gate.outputs.on == 'true'
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
          sudo apt-get install -y binaryen
          tools/build-wasm.sh
      - run: node --import ./backend/test/hooks.mjs --test backend/test/*.test.mjs
        if: steps.gate.outputs.on == 'true'
      - name: R2 buckets, CORS and backup expiry
        if: steps.gate.outputs.on == 'true'
        run: |
          buckets=$(npx --yes "$WRANGLER" r2 bucket list)
          for b in trainradar-live trainradar-history; do
            echo "$buckets" | grep -q "$b" || npx --yes "$WRANGLER" r2 bucket create "$b"
          done
          npx --yes "$WRANGLER" r2 bucket cors set trainradar-live --file backend/r2-cors.json --force
          if ! npx --yes "$WRANGLER" r2 bucket lifecycle list trainradar-history | grep -q backups-90d; then
            npx --yes "$WRANGLER" r2 bucket lifecycle add trainradar-history backups-90d backups/ \
              --expire-days 90 --force
          fi
          # Raw GPS log (backend/src/gpslog.js): kept 14 days.
          if ! npx --yes "$WRANGLER" r2 bucket lifecycle list trainradar-history | grep -q gps-14d; then
            npx --yes "$WRANGLER" r2 bucket lifecycle add trainradar-history gps-14d gps/ \
              --expire-days 14 --force
          fi
      # Only with the recorder: the D1 database (created once) and its
      # migrations; its binding is added to a copy of the config.
      - name: History database (D1)
        id: d1
        if: steps.gate.outputs.on == 'true' && steps.gate.outputs.recorder == 'true'
        run: |
          id() { npx --yes "$WRANGLER" d1 list --json | jq -r '.[] | select(.name=="trainradar-history") | .uuid'; }
          db=$(id)
          if [ -z "$db" ]; then
            npx --yes "$WRANGLER" d1 create trainradar-history
            db=$(id)
          fi
          [ -n "$db" ] || { echo "::error::no D1 database id"; exit 1; }
          cp backend/wrangler.toml backend/wrangler.deploy.toml
          printf '\n[[d1_databases]]\nbinding = "HISTORY"\ndatabase_name = "trainradar-history"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$db" \
            >> backend/wrangler.deploy.toml
          npx --yes "$WRANGLER" d1 migrations apply trainradar-history --remote --config backend/wrangler.deploy.toml
          echo "config=backend/wrangler.deploy.toml" >> "$GITHUB_OUTPUT"
      - name: Deploy the poller Worker
        if: steps.gate.outputs.on == 'true'
        env:
          CONFIG: ${{ steps.d1.outputs.config || 'backend/wrangler.toml' }}
          RECORDER: ${{ steps.gate.outputs.recorder == 'true' && 'true' || 'false' }}
          # Replay frames (TrainRadar Pro) are on with the recorder unless the
          # repository variable REPLAY_ENABLED is "false".
          REPLAY: ${{ vars.REPLAY_ENABLED == 'false' && 'false' || 'true' }}
        run: |
          npx --yes "$WRANGLER" deploy --config "$CONFIG" --var "RECORDER_ENABLED:$RECORDER" --var "REPLAY_ENABLED:$REPLAY" | tee deploy.txt
          url=$(grep -oE 'https://trainradar-live\.[a-z0-9-]+\.workers\.dev' deploy.txt | head -1)
          echo "Live poller: $url/rt/status.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RECORDER" = "true" ]; then
            echo "History API: $url/v1/history/lines?days=7" >> "$GITHUB_STEP_SUMMARY"
          fi
