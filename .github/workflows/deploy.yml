# Deploys TrainRadar to Cloudflare: the CORS pass-through Worker, the central
# live poller (phase C1, only once the repository variable LIVE_ENABLED is
# "true") and the static site on Pages, with freshly built reference data.
#   - on every merge to main
#   - nightly, only if Renfe's timetables changed (ETag) or the 7-day data
#     window needs moving forward
#   - manually (Actions → Deploy → Run workflow)
# Secrets (repository or "production" environment): CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. See docs/deploy.md. Never runs on pull requests.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *" # after Renfe's nightly GTFS updates (~00:05 and ~03:10 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: trainradar
  WRANGLER: wrangler@4.151.1
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: decide whether to deploy
    runs-on: ubuntu-latest
    environment: production
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Compare Renfe's timetables with the deployed ones
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PAGES_PROJECT" \
            | jq -r '.result.subdomain // empty') || true
          deployed=$(curl -fsS "https://$sub/data/manifest.json" || true)
          if [ -z "$sub" ] || [ -z "$deployed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=false
          for url in $(echo "$deployed" | jq -r '.sources[].url'); do
            now=$(curl -fsSI "$url" | grep -i '^etag:' | cut -d' ' -f2- | tr -d '\r"' || true)
            was=$(echo "$deployed" | jq -r --arg u "$url" '.sources[] | select(.url==$u) | .etag')
            echo "$url: deployed $was, now $now"
            [ -n "$now" ] && [ "$now" != "$was" ] && changed=true
          done
          # The data covers yesterday + 7 days; refresh at least every 3 days.
          start=$(echo "$deployed" | jq -r '.window_start')
          if [ "$(date -u -d "$start + 3 days" +%s)" -lt "$(date -u +%s)" ]; then changed=true; fi
          echo "run=$changed" >> "$GITHUB_OUTPUT"

  deploy:
    name: build and deploy
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.urls.outputs.site }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download Renfe GTFS (and OUIGO from the NAP)
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: tools/fetch-gtfs.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Week number (OSM cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm
        with:
          path: gtfs/rail.geojsonseq
          key: osm-rail-${{ steps.week.outputs.week }}
      - name: Download OpenStreetMap rail lines
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          tools/fetch-osm-rail.sh
      # Terrain heights for gradients: the rail nodes only change with the
      # OSM file, so sample the Copernicus DEM at most weekly too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dem
        with:
          path: gtfs/rail-heights.txt
          key: dem-heights-v1-${{ steps.week.outputs.week }}
      # The IGN API is slow and drops connections: fetch at most weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: igr
        with:
          path: gtfs/igr-rail.geojsonseq
          key: igr-rail-v1-${{ steps.week.outputs.week }}
      - name: Track count and electrification (IGN IGR-RT)
        if: steps.igr.outputs.cache-hit != 'true'
        continue-on-error: true # without it the build just lacks those facts
        run: python3 -I tools/fetch-igr-rail.py gtfs/igr-rail.geojsonseq
      - name: Terrain heights of the rail nodes (Copernicus DEM)
        if: steps.dem.outputs.cache-hit != 'true'
        continue-on-error: true # without heights the build just has no gradients
        run: |
          cargo build --release -q -p trainradar-refdata-build
          tools/fetch-dem-heights.sh
      - name: Build reference data
        run: |
          cargo run --release -q -p trainradar-refdata-build -- build --out build/data --gzip \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip --rail gtfs/rail.geojsonseq $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            $([ -s gtfs/rail-heights.txt ] && echo --rail-heights gtfs/rail-heights.txt) \
            $([ -s gtfs/igr-rail.geojsonseq ] && echo --rail-attrs gtfs/igr-rail.geojsonseq) \
            --sources gtfs/sources.tsv --report refdata.md
          cargo run --release -q -p trainradar-refdata-build -- verify build/data
          cat refdata.md >> "$GITHUB_STEP_SUMMARY"

      - name: Cloudflare names
        id: urls
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -H "$auth" "$api/pages/projects/$PAGES_PROJECT" >/dev/null; then
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch main
          fi
          pages=$(curl -fsS -H "$auth" "$api/pages/projects/$PAGES_PROJECT" | jq -r '.result.subdomain')
          workers=$(curl -fsS -H "$auth" "$api/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$workers" ]; then
            echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to create it."
            exit 1
          fi
          echo "site=https://$pages" >> "$GITHUB_OUTPUT"
          echo "proxy=https://trainradar-proxy.$workers.workers.dev/" >> "$GITHUB_OUTPUT"

      - name: Deploy the Worker (CORS pass-through)
        env:
          SITE: ${{ steps.urls.outputs.site }}
        run: npx --yes "$WRANGLER" deploy --config worker/wrangler.toml --var "ALLOWED_ORIGINS:$SITE"

      - name: Install wasm-bindgen-cli (version from Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
          sudo apt-get install -y binaryen
      - name: Build the site
        env:
          RT_BASE: ${{ steps.urls.outputs.proxy }}
          # Public URL of the central poller's bucket (custom domain). Empty:
          # the site stays on the pass-through. See docs/deploy.md.
          LIVE_BASE: ${{ vars.LIVE_PUBLIC_URL }}
          DIST: dist
          DATA_DIR: build/data
          VERSION: ${{ github.sha }}
        run: tools/build-web.sh
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name "$PAGES_PROJECT" \
            --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Smoke test the live site
        env:
          SITE: ${{ steps.urls.outputs.site }}
        run: |
          (cd tools/feed-check && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          sleep 20 # let the deployment propagate
          mkdir -p shots && node tools/feed-check/web-smoke.mjs "$SITE/" shots | tee smoke.txt
          echo "Live: $SITE" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(stats|OK)" smoke.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-site-screenshots
          path: shots
          retention-days: 14

  live:
    # Central poller and history recorder (backend/): Renfe fetched once for
    # everyone, bytes in R2; delays recorded to D1. Off until the maintainer
    # sets the variable LIVE_ENABLED=true (the API token needs R2 rights
    # first: docs/deploy.md). The recorder stays off until RECORDER_ENABLED
    # is also true (needs Workers Paid and D1 rights).
    name: deploy the live poller
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Read here, not in the job's `if`: a variable set on the "production"
      # environment is only visible once the job is running in it.
      - name: Are the live poller and the recorder enabled?
        id: gate
        env:
          LIVE_ENABLED: ${{ vars.LIVE_ENABLED }}
          RECORDER_ENABLED: ${{ vars.RECORDER_ENABLED }}
        run: |
          norm() { printf %s "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }
          if [ "$(norm "$LIVE_ENABLED")" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_ENABLED is not true: skipping the live poller." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(norm "$RECORDER_ENABLED")" = "true" ]; then
            echo "recorder=true" >> "$GITHUB_OUTPUT"
          else
            echo "RECORDER_ENABLED is not true: the history recorder stays off." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.on == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      # The recorder runs the app's engine: build it (web/pkg).
      - run: rustup show active-toolchain || rustup toolchain install
        if: steps.gate.outputs.on == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.gate.outputs.on == 'true'
      - name: Build the engine (WebAssembly)
        if: steps.gate.outputs.on == 'true'
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
          sudo apt-get install -y binaryen
          tools/build-wasm.sh
      - run: node --import ./backend/test/hooks.mjs --test backend/test/*.test.mjs
        if: steps.gate.outputs.on == 'true'
      - name: R2 buckets, CORS and backup expiry
        if: steps.gate.outputs.on == 'true'
        run: |
          buckets=$(npx --yes "$WRANGLER" r2 bucket list)
          for b in trainradar-live trainradar-history; do
            echo "$buckets" | grep -q "$b" || npx --yes "$WRANGLER" r2 bucket create "$b"
          done
          npx --yes "$WRANGLER" r2 bucket cors set trainradar-live --file backend/r2-cors.json --force
          if ! npx --yes "$WRANGLER" r2 bucket lifecycle list trainradar-history | grep -q backups-90d; then
            npx --yes "$WRANGLER" r2 bucket lifecycle add trainradar-history backups-90d backups/ \
              --expire-days 90 --force
          fi
      # Only with the recorder: the D1 database (created once) and its
      # migrations; its binding is added to a copy of the config.
      - name: History database (D1)
        id: d1
        if: steps.gate.outputs.on == 'true' && steps.gate.outputs.recorder == 'true'
        run: |
          id() { npx --yes "$WRANGLER" d1 list --json | jq -r '.[] | select(.name=="trainradar-history") | .uuid'; }
          db=$(id)
          if [ -z "$db" ]; then
            npx --yes "$WRANGLER" d1 create trainradar-history
            db=$(id)
          fi
          [ -n "$db" ] || { echo "::error::no D1 database id"; exit 1; }
          cp backend/wrangler.toml backend/wrangler.deploy.toml
          printf '\n[[d1_databases]]\nbinding = "HISTORY"\ndatabase_name = "trainradar-history"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$db" \
            >> backend/wrangler.deploy.toml
          npx --yes "$WRANGLER" d1 migrations apply trainradar-history --remote --config backend/wrangler.deploy.toml
          echo "config=backend/wrangler.deploy.toml" >> "$GITHUB_OUTPUT"
      - name: Deploy the poller Worker
        if: steps.gate.outputs.on == 'true'
        env:
          CONFIG: ${{ steps.d1.outputs.config || 'backend/wrangler.toml' }}
          RECORDER: ${{ steps.gate.outputs.recorder == 'true' && 'true' || 'false' }}
        run: |
          npx --yes "$WRANGLER" deploy --config "$CONFIG" --var "RECORDER_ENABLED:$RECORDER" | tee deploy.txt
          url=$(grep -oE 'https://trainradar-live\.[a-z0-9-]+\.workers\.dev' deploy.txt | head -1)
          echo "Live poller: $url/rt/status.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RECORDER" = "true" ]; then
            echo "History API: $url/v1/history/lines?days=7" >> "$GITHUB_STEP_SUMMARY"
          fi
