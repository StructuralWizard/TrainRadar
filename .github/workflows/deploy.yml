# Deploys TrainRadar to Cloudflare: the CORS pass-through Worker, the central
# live poller (phase C1, only once the repository variable LIVE_ENABLED is
# "true") and the static site on Pages, with freshly built reference data.
#   - on every merge to main
#   - nightly, only if Renfe's timetables changed (ETag) or the 7-day data
#     window needs moving forward
#   - manually (Actions → Deploy → Run workflow)
# Secrets (repository or "production" environment): CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. See docs/deploy.md. Never runs on pull requests.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *" # after Renfe's nightly GTFS updates (~00:05 and ~03:10 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: trainradar
  WRANGLER: wrangler@4.151.1
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: decide whether to deploy
    runs-on: ubuntu-latest
    environment: production
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Compare Renfe's timetables with the deployed ones
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          UK_ENABLED: ${{ vars.UK_ENABLED }}
          IE_ENABLED: ${{ vars.IE_ENABLED }}
          FR_ENABLED: ${{ vars.FR_ENABLED }}
          LU_ENABLED: ${{ vars.LU_ENABLED }}
          M2_ENABLED: ${{ vars.FI_ENABLED == 'true' || vars.NO_ENABLED == 'true' || vars.NL_ENABLED == 'true' }}
          M3_ENABLED: ${{ vars.CH_ENABLED == 'true' || vars.SE_ENABLED == 'true' || vars.PL_ENABLED == 'true' || vars.AT_ENABLED == 'true' || vars.CZ_ENABLED == 'true' }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PAGES_PROJECT" \
            | jq -r '.result.subdomain // empty') || true
          deployed=$(curl -fsS "https://$sub/data/manifest.json" || true)
          if [ -z "$sub" ] || [ -z "$deployed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=false
          for url in $(echo "$deployed" | jq -r '.sources[].url'); do
            now=$(curl -fsSI "$url" | grep -i '^etag:' | cut -d' ' -f2- | tr -d '\r"' || true)
            was=$(echo "$deployed" | jq -r --arg u "$url" '.sources[] | select(.url==$u) | .etag')
            echo "$url: deployed $was, now $now"
            [ -n "$now" ] && [ "$now" != "$was" ] && changed=true
          done
          # The data covers yesterday + 7 days; refresh at least every 3 days.
          start=$(echo "$deployed" | jq -r '.window_start')
          if [ "$(date -u -d "$start + 3 days" +%s)" -lt "$(date -u +%s)" ]; then changed=true; fi
          # The UK's timetable changes every day (short-term changes,
          # cancellations): with the UK on, rebuild daily.
          if [ "$UK_ENABLED" = "true" ]; then changed=true; fi
          # Ireland's live feed matches only the same day's timetable (the
          # NTA's ids change with every file): with Ireland on, rebuild daily.
          if [ "$IE_ENABLED" = "true" ]; then changed=true; fi
          # France's timetable changes daily too (strikes and works known the
          # evening before), and Luxembourg's comes weekly.
          if [ "$FR_ENABLED" = "true" ] || [ "$LU_ENABLED" = "true" ]; then changed=true; fi
          # Finland's, Norway's and the Netherlands' live ids match only the
          # same day's timetable too.
          if [ "$M2_ENABLED" = "true" ]; then changed=true; fi
          # Switzerland's, Sweden's, Poland's, Austria's and Czechia's too (Czechia's
          # cancellations come daily; Poland's comes from an
          # API, nine days at a time).
          if [ "$M3_ENABLED" = "true" ]; then changed=true; fi
          echo "run=$changed" >> "$GITHUB_OUTPUT"

  deploy:
    name: build and deploy
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.urls.outputs.site }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download Renfe GTFS (and OUIGO from the NAP)
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: tools/fetch-gtfs.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Week number (OSM cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm
        with:
          path: gtfs/rail.geojsonseq
          key: osm-rail-v2-${{ steps.week.outputs.week }}
          # A failed download falls back to the latest earlier week's file.
          restore-keys: osm-rail-v2-
      - name: Download OpenStreetMap rail lines
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          if ! timeout 25m tools/fetch-osm-rail.sh; then
            [ -s gtfs/rail.geojsonseq ] || exit 1
            echo "::warning::OSM download failed; building from an earlier week's rail lines"
          fi
      # Terrain heights for gradients: the rail nodes only change with the
      # OSM file, so sample the Copernicus DEM at most weekly too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dem
        with:
          path: gtfs/rail-heights.txt
          key: dem-heights-v2-${{ steps.week.outputs.week }}
      # The IGN API is slow and drops connections: fetch at most weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: igr
        with:
          path: gtfs/igr-rail.geojsonseq
          key: igr-rail-v1-${{ steps.week.outputs.week }}
      - name: Track count and electrification (IGN IGR-RT)
        if: steps.igr.outputs.cache-hit != 'true'
        continue-on-error: true # without it the build just lacks those facts
        run: python3 -I tools/fetch-igr-rail.py gtfs/igr-rail.geojsonseq
      - name: Terrain heights of the rail nodes (Copernicus DEM)
        if: steps.dem.outputs.cache-hit != 'true'
        continue-on-error: true # without heights the build just has no gradients
        run: |
          cargo build --release -q -p trainradar-refdata-build
          tools/fetch-dem-heights.sh
      - name: Build reference data
        run: |
          cargo run --release -q -p trainradar-refdata-build -- build --out build/data --gzip \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip --rail gtfs/rail.geojsonseq $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            $([ -s gtfs/rail-heights.txt ] && echo --rail-heights gtfs/rail-heights.txt) \
            $([ -s gtfs/igr-rail.geojsonseq ] && echo --rail-attrs gtfs/igr-rail.geojsonseq) \
            --stations gtfs/estaciones.geojson \
            --sources gtfs/sources.tsv --report refdata.md
          cargo run --release -q -p trainradar-refdata-build -- verify build/data
          cat refdata.md >> "$GITHUB_STEP_SUMMARY"
      # Plan ahead (docs/plan-future.md): the same feeds over 63 days, as far
      # as they go, without track, in data/plan/. The app loads them only
      # for a later date. Without them the site works as before.
      - name: Plan-ahead timetables
        continue-on-error: true
        run: |
          cargo run --release -q -p trainradar-refdata-build -- build --out build/plan --gzip --days 63 \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            --report plan.md
          cargo run --release -q -p trainradar-refdata-build -- verify build/plan
          mv build/plan build/data/plan
          { echo "## Plan-ahead timetables"; echo; cat plan.md; } >> "$GITHUB_STEP_SUMMARY"

      # The UK (plan 3), with UK_ENABLED: Network Rail's timetable, NaPTAN and
      # Great Britain's OSM track → data/uk/. A UK failure never stops
      # Spain's deploy: the site then just has no (or the previous) UK data.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.UK_ENABLED == 'true'
        id: osm_uk
        with:
          path: gtfs/uk/rail.geojsonseq
          # v3: Geofabrik's United Kingdom extract (with Northern Ireland, plan 4).
          key: osm-rail-uk-v3-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-uk-v3-
      - name: UK reference data
        if: vars.UK_ENABLED == 'true'
        continue-on-error: true
        env:
          NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
          NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
          OSM_CACHED: ${{ steps.osm_uk.outputs.cache-hit }}
        run: |
          set -o pipefail # a failed download stops here, with its own message
          [ "$OSM_CACHED" = "true" ] || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-uk.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/uk-data --gzip \
              --uk-schedule gtfs/uk/schedule.json.gz --naptan gtfs/uk/naptan.csv --corpus gtfs/uk/corpus.json.gz \
              --rail gtfs/uk/rail.geojsonseq --report refdata-uk.md \
              $( [ -s gtfs/uk/ni-txc.zip ] && echo --ni-txc gtfs/uk/ni-txc.zip ) \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/uk-data; then
            mv build/uk-data build/data/uk
            # Plan ahead: 63 days as far as published, in data/uk/plan/.
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/uk-plan --gzip --days 63 \
                --uk-schedule gtfs/uk/schedule.json.gz --naptan gtfs/uk/naptan.csv --corpus gtfs/uk/corpus.json.gz \
                $( [ -s gtfs/uk/ni-txc.zip ] && echo --ni-txc gtfs/uk/ni-txc.zip ) --report uk-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/uk-plan; then
              mv build/uk-plan build/data/uk/plan
              { echo "## UK plan-ahead timetables"; echo; cat uk-plan.md; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::UK plan-ahead timetables failed: the UK has today's week only."
            fi
            { echo "## UK reference data"; echo; cat refdata-uk.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::UK reference data failed: deploying Spain only."
            exit 1
          fi

      # Ireland (docs/europe/ie.md), with IE_ENABLED: Irish Rail's timetable
      # from the NTA (no key) and Ireland's OSM track → data/ie/. Like the
      # UK, an Irish failure never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.IE_ENABLED == 'true'
        id: osm_ie
        with:
          path: gtfs/ie/rail.geojsonseq
          key: osm-rail-ie-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-ie-v1-
      - name: Ireland reference data
        if: vars.IE_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_ie.outputs.cache-hit }}
        run: |
          set -o pipefail # a failed download stops here, with its own message
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-ie.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/ie-data --gzip \
              --ie-gtfs gtfs/ie/GTFS_Irish_Rail.zip --sources gtfs/ie/sources.tsv \
              $([ -s gtfs/ie/rail.geojsonseq ] && echo --rail gtfs/ie/rail.geojsonseq) --report refdata-ie.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/ie-data; then
            mv build/ie-data build/data/ie
            # Plan ahead: as far as the NTA publishes (about 3 weeks), in data/ie/plan/.
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/ie-plan --gzip --days 63 \
                --ie-gtfs gtfs/ie/GTFS_Irish_Rail.zip --report ie-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/ie-plan; then
              mv build/ie-plan build/data/ie/plan
            else
              echo "::warning::Ireland's plan-ahead timetables failed: Ireland has today's week only."
            fi
            { echo "## Ireland reference data"; echo; cat refdata-ie.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Ireland's reference data failed: deploying without Ireland."
            exit 1
          fi

      # France (docs/europe/fr.md), with FR_ENABLED: SNCF's timetable (no key)
      # and France's OSM track → data/fr/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.FR_ENABLED == 'true'
        id: osm_fr
        with:
          path: gtfs/fr/rail.geojsonseq
          key: osm-rail-fr-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-fr-v1-
      - name: France reference data
        if: vars.FR_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_fr.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-fr.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/fr-data --gzip \
              --fr-gtfs gtfs/fr/sncf.zip --sources gtfs/fr/sources.tsv \
              $([ -s gtfs/fr/rail.geojsonseq ] && echo --rail gtfs/fr/rail.geojsonseq) --report refdata-fr.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/fr-data; then
            mv build/fr-data build/data/fr
            # Plan ahead: 9 weeks (SNCF publishes about 5 months), in data/fr/plan/.
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/fr-plan --gzip --days 63 \
                --fr-gtfs gtfs/fr/sncf.zip --report fr-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/fr-plan; then
              mv build/fr-plan build/data/fr/plan
            else
              echo "::warning::France's plan-ahead timetables failed: France has today's week only."
            fi
            { echo "## France reference data"; echo; cat refdata-fr.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::France's reference data failed: deploying without France."
            exit 1
          fi

      # Luxembourg (docs/europe/west-central.md), with LU_ENABLED: CFL's trains
      # from the national GTFS (no key), by timetable → data/lu/.
      - name: Luxembourg reference data
        if: vars.LU_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-lu.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/lu-data --gzip \
              --lu-gtfs gtfs/lu/gtfs.zip --sources gtfs/lu/sources.tsv \
              $([ -s gtfs/lu/rail.geojsonseq ] && echo --rail gtfs/lu/rail.geojsonseq) --report refdata-lu.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/lu-data; then
            mv build/lu-data build/data/lu
            { echo "## Luxembourg reference data"; echo; cat refdata-lu.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Luxembourg's reference data failed: deploying without Luxembourg."
            exit 1
          fi

      # Finland (M2, docs/europe/registrations.md), with FI_ENABLED: open timetable
      # (no key) and OSM track → data/fi/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.FI_ENABLED == 'true'
        id: osm_fi
        with:
          path: gtfs/fi/rail.geojsonseq
          key: osm-rail-fi-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-fi-v1-
      - name: Finland reference data
        if: vars.FI_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_fi.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh fi | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/fi-data --gzip \
              --fi-gtfs gtfs/fi/gtfs.zip --sources gtfs/fi/sources.tsv \
              $([ -s gtfs/fi/rail.geojsonseq ] && echo --rail gtfs/fi/rail.geojsonseq) --report refdata-fi.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/fi-data; then
            mv build/fi-data build/data/fi
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/fi-plan --gzip --days 63 \
                --fi-gtfs gtfs/fi/gtfs.zip --report fi-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/fi-plan; then
              mv build/fi-plan build/data/fi/plan
            else
              echo "::warning::Finland's plan-ahead timetables failed: Finland has today's week only."
            fi
            { echo "## Finland reference data"; echo; cat refdata-fi.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Finland's reference data failed: deploying without Finland."
            exit 1
          fi

      # Norway (M2, docs/europe/registrations.md), with NO_ENABLED: open timetable
      # (no key) and OSM track → data/no/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.NO_ENABLED == 'true'
        id: osm_no
        with:
          path: gtfs/no/rail.geojsonseq
          key: osm-rail-no-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-no-v1-
      - name: Norway reference data
        if: vars.NO_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_no.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh no | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/no-data --gzip \
              --no-gtfs gtfs/no/gtfs.zip --sources gtfs/no/sources.tsv \
              $([ -s gtfs/no/rail.geojsonseq ] && echo --rail gtfs/no/rail.geojsonseq) --report refdata-no.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/no-data; then
            mv build/no-data build/data/no
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/no-plan --gzip --days 63 \
                --no-gtfs gtfs/no/gtfs.zip --report no-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/no-plan; then
              mv build/no-plan build/data/no/plan
            else
              echo "::warning::Norway's plan-ahead timetables failed: Norway has today's week only."
            fi
            { echo "## Norway reference data"; echo; cat refdata-no.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Norway's reference data failed: deploying without Norway."
            exit 1
          fi

      # Netherlands (M2, docs/europe/registrations.md), with NL_ENABLED: open timetable
      # (no key) and OSM track → data/nl/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.NL_ENABLED == 'true'
        id: osm_nl
        with:
          path: gtfs/nl/rail.geojsonseq
          key: osm-rail-nl-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-nl-v1-
      - name: Netherlands reference data
        if: vars.NL_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_nl.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh nl | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/nl-data --gzip \
              --nl-gtfs gtfs/nl/gtfs.zip --sources gtfs/nl/sources.tsv \
              $([ -s gtfs/nl/rail.geojsonseq ] && echo --rail gtfs/nl/rail.geojsonseq) --report refdata-nl.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/nl-data; then
            mv build/nl-data build/data/nl
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/nl-plan --gzip --days 63 \
                --nl-gtfs gtfs/nl/gtfs.zip --report nl-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/nl-plan; then
              mv build/nl-plan build/data/nl/plan
            else
              echo "::warning::Netherlands's plan-ahead timetables failed: Netherlands has today's week only."
            fi
            { echo "## Netherlands reference data"; echo; cat refdata-nl.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Netherlands's reference data failed: deploying without Netherlands."
            exit 1
          fi

      # Switzerland (M3), with CH_ENABLED: opentransportdata.swiss's timetable (no key)
      # and OSM track → data/ch/; live delays from the eu job. Never stops the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.CH_ENABLED == 'true'
        id: osm_ch
        with:
          path: gtfs/ch/rail.geojsonseq
          key: osm-rail-ch-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-ch-v1-
      - name: Switzerland reference data
        if: vars.CH_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_ch.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh ch | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/ch-data --gzip \
              --ch-gtfs gtfs/ch/gtfs.zip --sources gtfs/ch/sources.tsv \
              $([ -s gtfs/ch/rail.geojsonseq ] && echo --rail gtfs/ch/rail.geojsonseq) --report refdata-ch.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/ch-data; then
            mv build/ch-data build/data/ch
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/ch-plan --gzip --days 63 \
                --ch-gtfs gtfs/ch/gtfs.zip --report ch-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/ch-plan; then
              mv build/ch-plan build/data/ch/plan
            else
              echo "::warning::Switzerland's plan-ahead timetables failed: Switzerland has today's week only."
            fi
            { echo "## Switzerland reference data"; echo; cat refdata-ch.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Switzerland's reference data failed: deploying without Switzerland."
            exit 1
          fi

      # Sweden (M3), with SE_ENABLED: Trafiklab's GTFS Sweden 3 (key in its URL, as
      # Trafiklab requires: AGENTS.md) and OSM track → data/se/, by timetable for now.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.SE_ENABLED == 'true'
        id: osm_se
        with:
          path: gtfs/se/rail.geojsonseq
          key: osm-rail-se-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-se-v1-
      - name: Sweden reference data
        if: vars.SE_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_se.outputs.cache-hit }}
          SE_TRAFIKLAB_STATIC_KEY: ${{ secrets.SE_TRAFIKLAB_STATIC_KEY }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh se | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/se-data --gzip \
              --se-gtfs gtfs/se/gtfs.zip --sources gtfs/se/sources.tsv \
              $([ -s gtfs/se/rail.geojsonseq ] && echo --rail gtfs/se/rail.geojsonseq) --report refdata-se.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/se-data; then
            mv build/se-data build/data/se
            # Our trains' trip ids: the Worker keeps these from Trafiklab's
            # regional live feeds (backend-eu/src/sweden.js).
            unzip -p gtfs/se/gtfs.zip trips.txt | python3 -I -c "import csv,sys; [print(r['trip_id']) for r in csv.DictReader(sys.stdin)]" > build/data/se/rail-trips.txt
            { echo "## Sweden reference data"; echo; cat refdata-se.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Sweden's reference data failed: deploying without Sweden."
            exit 1
          fi

      # Poland (M5), with PL_ENABLED: PKP PLK's schedules as GTFS (tools/plk-gtfs.py,
      # key in a header) and OSM track → data/pl/; live delays from the eu job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.PL_ENABLED == 'true'
        id: osm_pl
        with:
          path: gtfs/pl/rail.geojsonseq
          key: osm-rail-pl-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-pl-v1-
      - name: Poland reference data
        if: vars.PL_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_pl.outputs.cache-hit }}
          PL_PLK_API_KEY: ${{ secrets.PL_PLK_API_KEY }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh pl | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/pl-data --gzip \
              --pl-gtfs gtfs/pl/gtfs.zip --sources gtfs/pl/sources.tsv \
              $([ -s gtfs/pl/rail.geojsonseq ] && echo --rail gtfs/pl/rail.geojsonseq) --report refdata-pl.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/pl-data; then
            mv build/pl-data build/data/pl
            { echo "## Poland reference data"; echo; cat refdata-pl.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Poland's reference data failed: deploying without Poland."
            exit 1
          fi

      # Austria (M4), with AT_ENABLED: Mobilitätsverbünde Österreich's rail GTFS
      # (portal login AT_MVO_*), timetable only, and OSM track → data/at/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.AT_ENABLED == 'true'
        id: osm_at
        with:
          path: gtfs/at/rail.geojsonseq
          key: osm-rail-at-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-at-v1-
      - name: Austria reference data
        if: vars.AT_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_at.outputs.cache-hit }}
          AT_MVO_USERNAME: ${{ secrets.AT_MVO_USERNAME }}
          AT_MVO_PASSWORD: ${{ secrets.AT_MVO_PASSWORD }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh at | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/at-data --gzip \
              --at-gtfs gtfs/at/gtfs.zip --sources gtfs/at/sources.tsv \
              $([ -s gtfs/at/rail.geojsonseq ] && echo --rail gtfs/at/rail.geojsonseq) --report refdata-at.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/at-data; then
            mv build/at-data build/data/at
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/at-plan --gzip --days 63 \
                --at-gtfs gtfs/at/gtfs.zip --report at-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/at-plan; then
              mv build/at-plan build/data/at/plan
            else
              echo "::warning::Austria's plan-ahead timetables failed: Austria has today's week only."
            fi
            { echo "## Austria reference data"; echo; cat refdata-at.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Austria's reference data failed: deploying without Austria."
            exit 1
          fi

      # Slovakia (M4), with SK_ENABLED: timetable only (no key) → data/sk/.
      - name: Slovakia reference data
        if: vars.SK_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh sk | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/sk-data --gzip \
              --sk-gtfs gtfs/sk/gtfs.zip --sources gtfs/sk/sources.tsv \
              $([ -s gtfs/sk/rail.geojsonseq ] && echo --rail gtfs/sk/rail.geojsonseq) --report refdata-sk.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/sk-data; then
            mv build/sk-data build/data/sk
            { echo "## Slovakia reference data"; echo; cat refdata-sk.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Slovakia's reference data failed: deploying without Slovakia."
            exit 1
          fi

      # Estonia (M4), with EE_ENABLED: timetable only (no key) → data/ee/.
      - name: Estonia reference data
        if: vars.EE_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh ee | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/ee-data --gzip \
              --ee-gtfs gtfs/ee/gtfs.zip --sources gtfs/ee/sources.tsv \
              $([ -s gtfs/ee/rail.geojsonseq ] && echo --rail gtfs/ee/rail.geojsonseq) --report refdata-ee.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/ee-data; then
            mv build/ee-data build/data/ee
            { echo "## Estonia reference data"; echo; cat refdata-ee.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Estonia's reference data failed: deploying without Estonia."
            exit 1
          fi

      # Czechia, with CZ_ENABLED: CIS JŘ's national timetable (NeTEx, minus the
      # CZPTT cancellations), no key; stations and track from OSM (weekly)
      # → data/cz/ (cz long distance, cz-r regional), by timetable. The
      # portal's files are cached: a day's run fetches only the new ones.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.CZ_ENABLED == 'true'
        id: osm_cz
        with:
          path: |
            gtfs/cz/rail.geojsonseq
            gtfs/cz/stations.geojsonseq
          key: osm-rail-cz-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-cz-v1-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.CZ_ENABLED == 'true'
        with:
          path: gtfs/cz/cisjr
          key: cisjr-v1-${{ github.run_id }}
          restore-keys: cisjr-v1-
      - name: Czechia reference data
        if: vars.CZ_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_cz.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh cz | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/cz-data --gzip \
              --cz-gtfs gtfs/cz/gtfs.zip --sources gtfs/cz/sources.tsv \
              $([ -s gtfs/cz/rail.geojsonseq ] && echo --rail gtfs/cz/rail.geojsonseq) --report refdata-cz.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/cz-data; then
            mv build/cz-data build/data/cz
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/cz-plan --gzip --days 63 \
                --cz-gtfs gtfs/cz/gtfs.zip --report cz-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/cz-plan; then
              mv build/cz-plan build/data/cz/plan
            else
              echo "::warning::Czechia's plan-ahead timetables failed: Czechia has today's week only."
            fi
            { echo "## Czechia reference data"; echo; cat refdata-cz.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Czechia's reference data failed: deploying without Czechia."
            exit 1
          fi

      - name: Cloudflare names
        id: urls
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -H "$auth" "$api/pages/projects/$PAGES_PROJECT" >/dev/null; then
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch main
          fi
          pages=$(curl -fsS -H "$auth" "$api/pages/projects/$PAGES_PROJECT" | jq -r '.result.subdomain')
          workers=$(curl -fsS -H "$auth" "$api/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$workers" ]; then
            echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to create it."
            exit 1
          fi
          echo "site=https://$pages" >> "$GITHUB_OUTPUT"
          echo "proxy=https://trainradar-proxy.$workers.workers.dev/" >> "$GITHUB_OUTPUT"

      - name: Deploy the Worker (CORS pass-through)
        env:
          SITE: ${{ steps.urls.outputs.site }}
        # The Pages address and the custom domain (docs/deploy.md).
        run: npx --yes "$WRANGLER" deploy --config worker/wrangler.toml --var "ALLOWED_ORIGINS:$SITE,https://mytrainradar.com,https://www.mytrainradar.com"

      - name: Install wasm-bindgen-cli (version from Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
          sudo apt-get install -y binaryen
      - name: Build the site
        env:
          RT_BASE: ${{ steps.urls.outputs.proxy }}
          # Public URL of the central poller's bucket (custom domain). Empty:
          # the site stays on the pass-through. See docs/deploy.md.
          LIVE_BASE: ${{ vars.LIVE_PUBLIC_URL }}
          API_BASE: ${{ vars.API_PUBLIC_URL }}
          DIST: dist
          DATA_DIR: build/data
          VERSION: ${{ github.sha }}
        run: APP_VERSION="web-${GITHUB_SHA::7}" tools/build-web.sh
      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name "$PAGES_PROJECT" \
            --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

      # Tell Bing (which feeds ChatGPT search and Copilot), Yandex and other
      # IndexNow engines that the pages changed, so they recrawl in hours,
      # not weeks. The key file is public by design. docs/seo.md.
      - name: Notify search engines (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          key=$(basename "$(ls web/[0-9a-f]*[0-9a-f].txt)" .txt)
          urls=$(grep -o '<loc>[^<]*</loc>' web/sitemap.xml | sed 's#</\?loc>##g' | jq -R . | jq -s .)
          jq -n --arg key "$key" --argjson urls "$urls" \
            '{host: "mytrainradar.com", key: $key, keyLocation: "https://mytrainradar.com/\($key).txt", urlList: $urls}' \
            | curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
                -H "Content-Type: application/json; charset=utf-8" --data-binary @- | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live site
        env:
          SITE: ${{ steps.urls.outputs.site }}
        run: |
          (cd tools/feed-check && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          sleep 20 # let the deployment propagate
          # Every other country deployed opens from its ?country= link too.
          COUNTRIES=$(for m in dist/data/*/manifest.json; do [ -f "$m" ] && basename "$(dirname "$m")"; done | grep -vx plan | tr '\n' ' ' || true)
          export COUNTRIES
          mkdir -p shots && node tools/feed-check/web-smoke.mjs "$SITE/" shots | tee smoke.txt
          echo "Live: $SITE" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(stats|OK|country)" smoke.txt | sed 's/$/  /' >> "$GITHUB_STEP_SUMMARY" || true
          if grep -q "^country .*: FAIL" smoke.txt; then echo "::warning::A country did not open from its link: see the summary."; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-site-screenshots
          path: shots
          retention-days: 14

  uk:
    # UK ingest (backend-uk/, plan 3): drains Network Rail's TRUST feed every
    # minute into uk/rt/ in the live bucket. Off until the maintainer sets the
    # variable UK_ENABLED=true; uses the Network Rail login secrets.
    name: deploy the UK ingest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Is the UK ingest enabled, and did it change?
        id: gate
        env:
          UK_ENABLED: ${{ vars.UK_ENABLED }}
          EVENT: ${{ github.event_name }}
        run: |
          norm() { printf %s "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }
          if [ "$(norm "$UK_ENABLED")" != "true" ]; then
            echo "UK_ENABLED is not true: skipping the UK ingest." | tee -a "$GITHUB_STEP_SUMMARY"
          # A redeploy restarts the Worker, possibly in the middle of a drain,
          # and Network Rail's broker then refuses our client-id for a while
          # (AMQ339009). So a merge redeploys it only when backend-uk/ changed;
          # Run workflow always does.
          elif [ "$EVENT" = "push" ] && git diff --quiet HEAD^ HEAD -- backend-uk/; then
            echo "backend-uk/ unchanged: the UK ingest keeps running as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      - run: node --test backend-uk/test/*.test.mjs
        if: steps.gate.outputs.on == 'true'
      - name: Deploy the UK ingest Worker
        if: steps.gate.outputs.on == 'true'
        env:
          NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
          NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
          NATIONAL_RAIL_KB_KEY: ${{ secrets.NATIONAL_RAIL_KB_KEY }}
        run: |
          npx --yes "$WRANGLER" deploy --config backend-uk/wrangler.toml --var "UK_ENABLED:true"
          # Secrets on stdin, never on the command line.
          printf '%s' "$NETWORK_RAIL_USERNAME" | npx --yes "$WRANGLER" secret put NETWORK_RAIL_USERNAME --config backend-uk/wrangler.toml
          printf '%s' "$NETWORK_RAIL_PASSWORD" | npx --yes "$WRANGLER" secret put NETWORK_RAIL_PASSWORD --config backend-uk/wrangler.toml
          # National Rail incidents (Rail Data Marketplace), when the key is set.
          if [ -n "$NATIONAL_RAIL_KB_KEY" ]; then
            printf '%s' "$NATIONAL_RAIL_KB_KEY" | npx --yes "$WRANGLER" secret put NATIONAL_RAIL_KB_KEY --config backend-uk/wrangler.toml
          fi
          echo "UK ingest deployed: its status is uk/rt/status.json on the live domain." >> "$GITHUB_STEP_SUMMARY"

  eu:
    # Europe ingest (backend-eu/, docs/plan-europe.md A5): Ireland's live
    # feed from the NTA, with IE_ENABLED=true and the IE_NTA_API_KEY secret;
    # France's SNCF feeds with FR_ENABLED=true; Finland, Norway and the
    # Netherlands with FI_, NO_ and NL_ENABLED=true (no keys).
    name: deploy the Europe ingest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Is the Europe ingest enabled, and did it change?
        id: gate
        env:
          IE_ENABLED: ${{ vars.IE_ENABLED }}
          FR_ENABLED: ${{ vars.FR_ENABLED }}
          FI_ENABLED: ${{ vars.FI_ENABLED }}
          NO_ENABLED: ${{ vars.NO_ENABLED }}
          NL_ENABLED: ${{ vars.NL_ENABLED }}
          CH_ENABLED: ${{ vars.CH_ENABLED }}
          PL_ENABLED: ${{ vars.PL_ENABLED }}
          # Sweden's live data has its own switch: it needs Trafiklab's Silver
          # level, the timetable (SE_ENABLED) doesn't.
          SE_LIVE_ENABLED: ${{ vars.SE_LIVE_ENABLED }}
          # Czechia's live data (Golemio, no key) too: its own switch, apart
          # from the timetable (CZ_ENABLED).
          CZ_LIVE_ENABLED: ${{ vars.CZ_LIVE_ENABLED }}
          HAS_KEY: ${{ secrets.IE_NTA_API_KEY != '' }}
          HAS_CH_KEY: ${{ secrets.CH_OTD_GTFSRT_KEY != '' }}
          HAS_PL_KEY: ${{ secrets.PL_PLK_API_KEY != '' }}
          HAS_SE_KEY: ${{ secrets.SE_TRAFIKLAB_RT_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          norm() { printf %s "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }
          # Ireland needs its key too; the others need no key.
          on() { [ "$(norm "$1")" = "true" ] && echo true || echo false; }
          ie=false
          if [ "$(norm "$IE_ENABLED")" = "true" ] && [ "$HAS_KEY" = "true" ]; then ie=true; fi
          fr=$(on "$FR_ENABLED"); fi_=$(on "$FI_ENABLED"); no=$(on "$NO_ENABLED"); nl=$(on "$NL_ENABLED")
          # Switzerland and Poland need their keys too.
          ch=false; pl=false; se=false
          if [ "$(on "$CH_ENABLED")" = "true" ] && [ "$HAS_CH_KEY" = "true" ]; then ch=true; fi
          if [ "$(on "$PL_ENABLED")" = "true" ] && [ "$HAS_PL_KEY" = "true" ]; then pl=true; fi
          if [ "$(on "$SE_LIVE_ENABLED")" = "true" ] && [ "$HAS_SE_KEY" = "true" ]; then se=true; fi
          cz=$(on "$CZ_LIVE_ENABLED")
          { echo "ie=$ie"; echo "fr=$fr"; echo "fi=$fi_"; echo "no=$no"; echo "nl=$nl"; echo "ch=$ch"; echo "pl=$pl"; echo "se=$se"; echo "cz=$cz"; } >> "$GITHUB_OUTPUT"
          if [ "$ie$fr$fi_$no$nl$ch$pl$se$cz" = "falsefalsefalsefalsefalsefalsefalsefalsefalse" ]; then
            echo "No Europe country is on (IE_ENABLED with IE_NTA_API_KEY, FR_, FI_, NO_, NL_ENABLED, CH_, PL_ENABLED or SE_LIVE_ENABLED with their keys, CZ_LIVE_ENABLED): skipping the Europe ingest." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT" = "push" ] && git diff --quiet HEAD^ HEAD -- backend-eu/; then
            echo "backend-eu/ unchanged: the Europe ingest keeps running as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      - run: node --test backend-eu/test/*.test.mjs
        if: steps.gate.outputs.on == 'true'
      - name: Deploy the Europe ingest Worker
        if: steps.gate.outputs.on == 'true'
        env:
          IE_NTA_API_KEY: ${{ secrets.IE_NTA_API_KEY }}
          IE_ON: ${{ steps.gate.outputs.ie }}
          FR_ON: ${{ steps.gate.outputs.fr }}
          FI_ON: ${{ steps.gate.outputs.fi }}
          NO_ON: ${{ steps.gate.outputs.no }}
          NL_ON: ${{ steps.gate.outputs.nl }}
          CH_ON: ${{ steps.gate.outputs.ch }}
          PL_ON: ${{ steps.gate.outputs.pl }}
          SE_ON: ${{ steps.gate.outputs.se }}
          CZ_ON: ${{ steps.gate.outputs.cz }}
          SE_TRAFIKLAB_RT_KEY: ${{ secrets.SE_TRAFIKLAB_RT_KEY }}
          CH_OTD_GTFSRT_KEY: ${{ secrets.CH_OTD_GTFSRT_KEY }}
          CH_OTD_GTFSSA_KEY: ${{ secrets.CH_OTD_GTFSSA_KEY }}
          CH_OTD_GTFSSA_PLANNED_KEY: ${{ secrets.CH_OTD_GTFSSA_PLANNED_KEY }}
          PL_PLK_API_KEY: ${{ secrets.PL_PLK_API_KEY }}
        run: |
          npx --yes "$WRANGLER" deploy --config backend-eu/wrangler.toml --var "IE_ENABLED:$IE_ON" --var "FR_ENABLED:$FR_ON" \
            --var "FI_ENABLED:$FI_ON" --var "NO_ENABLED:$NO_ON" --var "NL_ENABLED:$NL_ON" \
            --var "CH_ENABLED:$CH_ON" --var "PL_ENABLED:$PL_ON" --var "SE_ENABLED:$SE_ON" \
            --var "CZ_ENABLED:$CZ_ON"
          # Keys on stdin, never on the command line.
          put() { [ -n "$2" ] && printf '%s' "$2" | npx --yes "$WRANGLER" secret put "$1" --config backend-eu/wrangler.toml; }
          if [ "$IE_ON" = "true" ]; then put IE_NTA_API_KEY "$IE_NTA_API_KEY"; fi
          if [ "$CH_ON" = "true" ]; then
            put CH_OTD_GTFSRT_KEY "$CH_OTD_GTFSRT_KEY"
            put CH_OTD_GTFSSA_KEY "$CH_OTD_GTFSSA_KEY" || true
            put CH_OTD_GTFSSA_PLANNED_KEY "$CH_OTD_GTFSSA_PLANNED_KEY" || true
          fi
          if [ "$PL_ON" = "true" ]; then put PL_PLK_API_KEY "$PL_PLK_API_KEY"; fi
          if [ "$SE_ON" = "true" ]; then put SE_TRAFIKLAB_RT_KEY "$SE_TRAFIKLAB_RT_KEY"; fi
          echo "Europe ingest deployed (Ireland: $IE_ON, France: $FR_ON, Finland: $FI_ON, Norway: $NO_ON, Netherlands: $NL_ON, Switzerland: $CH_ON, Poland: $PL_ON, Sweden: $SE_ON, Czechia: $CZ_ON); each country's status is <country>/rt/status.json on the live domain." >> "$GITHUB_STEP_SUMMARY"

  live:
    # Central poller and history recorder (backend/): Renfe fetched once for
    # everyone, bytes in R2; delays recorded to D1. Off until the maintainer
    # sets the variable LIVE_ENABLED=true (the API token needs R2 rights
    # first: docs/deploy.md). The recorder stays off until RECORDER_ENABLED
    # is also true (needs Workers Paid and D1 rights).
    name: deploy the live poller
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Read here, not in the job's `if`: a variable set on the "production"
      # environment is only visible once the job is running in it.
      - name: Are the live poller and the recorder enabled?
        id: gate
        env:
          LIVE_ENABLED: ${{ vars.LIVE_ENABLED }}
          RECORDER_ENABLED: ${{ vars.RECORDER_ENABLED }}
        run: |
          norm() { printf %s "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'; }
          if [ "$(norm "$LIVE_ENABLED")" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_ENABLED is not true: skipping the live poller." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(norm "$RECORDER_ENABLED")" = "true" ]; then
            echo "recorder=true" >> "$GITHUB_OUTPUT"
          else
            echo "RECORDER_ENABLED is not true: the history recorder stays off." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.on == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      # The recorder runs the app's engine: build it (web/pkg).
      - run: rustup show active-toolchain || rustup toolchain install
        if: steps.gate.outputs.on == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.gate.outputs.on == 'true'
      - name: Build the engine (WebAssembly)
        if: steps.gate.outputs.on == 'true'
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
          sudo apt-get install -y binaryen
          tools/build-wasm.sh
      - run: node --import ./backend/test/hooks.mjs --test backend/test/*.test.mjs
        if: steps.gate.outputs.on == 'true'
      - name: R2 buckets, CORS and backup expiry
        if: steps.gate.outputs.on == 'true'
        run: |
          buckets=$(npx --yes "$WRANGLER" r2 bucket list)
          for b in trainradar-live trainradar-history; do
            echo "$buckets" | grep -q "$b" || npx --yes "$WRANGLER" r2 bucket create "$b"
          done
          npx --yes "$WRANGLER" r2 bucket cors set trainradar-live --file backend/r2-cors.json --force
          if ! npx --yes "$WRANGLER" r2 bucket lifecycle list trainradar-history | grep -q backups-90d; then
            npx --yes "$WRANGLER" r2 bucket lifecycle add trainradar-history backups-90d backups/ \
              --expire-days 90 --force
          fi
          # Raw GPS log (backend/src/gpslog.js): kept 14 days.
          if ! npx --yes "$WRANGLER" r2 bucket lifecycle list trainradar-history | grep -q gps-14d; then
            npx --yes "$WRANGLER" r2 bucket lifecycle add trainradar-history gps-14d gps/ \
              --expire-days 14 --force
          fi
      # Only with the recorder: the D1 database (created once) and its
      # migrations; its binding is added to a copy of the config.
      - name: History database (D1)
        id: d1
        if: steps.gate.outputs.on == 'true' && steps.gate.outputs.recorder == 'true'
        run: |
          id() { npx --yes "$WRANGLER" d1 list --json | jq -r '.[] | select(.name=="trainradar-history") | .uuid'; }
          db=$(id)
          if [ -z "$db" ]; then
            npx --yes "$WRANGLER" d1 create trainradar-history
            db=$(id)
          fi
          [ -n "$db" ] || { echo "::error::no D1 database id"; exit 1; }
          cp backend/wrangler.toml backend/wrangler.deploy.toml
          printf '\n[[d1_databases]]\nbinding = "HISTORY"\ndatabase_name = "trainradar-history"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$db" \
            >> backend/wrangler.deploy.toml
          npx --yes "$WRANGLER" d1 migrations apply trainradar-history --remote --config backend/wrangler.deploy.toml
          echo "config=backend/wrangler.deploy.toml" >> "$GITHUB_OUTPUT"
      - name: Deploy the poller Worker
        if: steps.gate.outputs.on == 'true'
        env:
          CONFIG: ${{ steps.d1.outputs.config || 'backend/wrangler.toml' }}
          RECORDER: ${{ steps.gate.outputs.recorder == 'true' && 'true' || 'false' }}
          # Replay frames (TrainRadar Pro) are on with the recorder unless the
          # repository variable REPLAY_ENABLED is "false".
          REPLAY: ${{ vars.REPLAY_ENABLED == 'false' && 'false' || 'true' }}
        run: |
          npx --yes "$WRANGLER" deploy --config "$CONFIG" --var "RECORDER_ENABLED:$RECORDER" --var "REPLAY_ENABLED:$REPLAY" | tee deploy.txt
          url=$(grep -oE 'https://trainradar-live\.[a-z0-9-]+\.workers\.dev' deploy.txt | head -1)
          echo "Live poller: $url/rt/status.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RECORDER" = "true" ]; then
            echo "History API: $url/v1/history/lines?days=7" >> "$GITHUB_STEP_SUMMARY"
          fi
