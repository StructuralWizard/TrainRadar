# Deploys TrainRadar to Cloudflare: the CORS pass-through Worker, the central
# live poller (phase C1, only once the repository variable LIVE_ENABLED is
# "true") and the static site on Pages, with freshly built reference data.
#   - on every merge to main
#   - nightly, only if Renfe's timetables changed (ETag) or the 7-day data
#     window needs moving forward
#   - manually (Actions → Deploy → Run workflow)
# Secrets (repository or "production" environment): CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. See docs/deploy.md. Never runs on pull requests.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *" # after Renfe's nightly GTFS updates (~00:05 and ~03:10 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: trainradar
  WRANGLER: wrangler@4.151.1
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: decide whether to deploy
    runs-on: ubuntu-latest
    environment: production
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Compare Renfe's timetables with the deployed ones
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          UK_ENABLED: ${{ vars.UK_ENABLED }}
          IE_ENABLED: ${{ vars.IE_ENABLED }}
          FR_ENABLED: ${{ vars.FR_ENABLED }}
          LU_ENABLED: ${{ vars.LU_ENABLED }}
          M2_ENABLED: ${{ vars.FI_ENABLED == 'true' || vars.NO_ENABLED == 'true' || vars.NL_ENABLED == 'true' }}
          M3_ENABLED: ${{ vars.CH_ENABLED == 'true' || vars.SE_ENABLED == 'true' || vars.PL_ENABLED == 'true' || vars.AT_ENABLED == 'true' || vars.CZ_ENABLED == 'true' || vars.DK_ENABLED == 'true' || vars.DE_ENABLED == 'true' || vars.BE_ENABLED == 'true' || vars.AU_NSW_ENABLED == 'true' || vars.AU_VIC_ENABLED == 'true' || vars.NZ_WLG_ENABLED == 'true' || vars.NZ_AKL_ENABLED == 'true' || vars.SG_ENABLED == 'true' || vars.PT_ENABLED == 'true' || vars.JP_ENABLED == 'true' }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PAGES_PROJECT" \
            | jq -r '.result.subdomain // empty') || true
          deployed=$(curl -fsS "https://$sub/data/manifest.json" || true)
          if [ -z "$sub" ] || [ -z "$deployed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=false
          for url in $(echo "$deployed" | jq -r '.sources[].url'); do
            now=$(curl -fsSI "$url" | grep -i '^etag:' | cut -d' ' -f2- | tr -d '\r"' || true)
            was=$(echo "$deployed" | jq -r --arg u "$url" '.sources[] | select(.url==$u) | .etag')
            echo "$url: deployed $was, now $now"
            [ -n "$now" ] && [ "$now" != "$was" ] && changed=true
          done
          # The data covers yesterday + 7 days; refresh at least every 3 days.
          start=$(echo "$deployed" | jq -r '.window_start')
          if [ "$(date -u -d "$start + 3 days" +%s)" -lt "$(date -u +%s)" ]; then changed=true; fi
          # The UK's timetable changes every day (short-term changes,
          # cancellations): with the UK on, rebuild daily.
          if [ "$UK_ENABLED" = "true" ]; then changed=true; fi
          # Ireland's live feed matches only the same day's timetable (the
          # NTA's ids change with every file): with Ireland on, rebuild daily.
          if [ "$IE_ENABLED" = "true" ]; then changed=true; fi
          # France's timetable changes daily too (strikes and works known the
          # evening before), and Luxembourg's comes weekly.
          if [ "$FR_ENABLED" = "true" ] || [ "$LU_ENABLED" = "true" ]; then changed=true; fi
          # Finland's, Norway's and the Netherlands' live ids match only the
          # same day's timetable too.
          if [ "$M2_ENABLED" = "true" ]; then changed=true; fi
          # Switzerland's, Sweden's, Poland's, Austria's and Czechia's too (Czechia's
          # cancellations come daily; Poland's comes from an
          # API, nine days at a time).
          if [ "$M3_ENABLED" = "true" ]; then changed=true; fi
          echo "run=$changed" >> "$GITHUB_OUTPUT"

  deploy:
    name: build and deploy
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.urls.outputs.site }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download Renfe GTFS (and OUIGO from the NAP)
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: tools/fetch-gtfs.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Week number and date (cache keys)
        id: week
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osm
        with:
          path: gtfs/rail.geojsonseq
          key: osm-rail-v2-${{ steps.week.outputs.week }}
          # A failed download falls back to the latest earlier week's file.
          restore-keys: osm-rail-v2-
      - name: Download OpenStreetMap rail lines
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y osmium-tool
          if ! timeout 25m tools/fetch-osm-rail.sh; then
            [ -s gtfs/rail.geojsonseq ] || exit 1
            echo "::warning::OSM download failed; building from an earlier week's rail lines"
          fi
      # Terrain heights for gradients: the rail nodes only change with the
      # OSM file, so sample the Copernicus DEM at most weekly too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dem
        with:
          path: gtfs/rail-heights.txt
          key: dem-heights-v2-${{ steps.week.outputs.week }}
      # The IGN API is slow and drops connections: fetch at most weekly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: igr
        with:
          path: gtfs/igr-rail.geojsonseq
          key: igr-rail-v1-${{ steps.week.outputs.week }}
      - name: Track count and electrification (IGN IGR-RT)
        if: steps.igr.outputs.cache-hit != 'true'
        continue-on-error: true # without it the build just lacks those facts
        run: python3 -I tools/fetch-igr-rail.py gtfs/igr-rail.geojsonseq
      - name: Terrain heights of the rail nodes (Copernicus DEM)
        if: steps.dem.outputs.cache-hit != 'true'
        continue-on-error: true # without heights the build just has no gradients
        run: |
          cargo build --release -q -p trainradar-refdata-build
          tools/fetch-dem-heights.sh
      - name: Build reference data
        run: |
          cargo run --release -q -p trainradar-refdata-build -- build --out build/data --gzip \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip --rail gtfs/rail.geojsonseq $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            $([ -s gtfs/rail-heights.txt ] && echo --rail-heights gtfs/rail-heights.txt) \
            $([ -s gtfs/igr-rail.geojsonseq ] && echo --rail-attrs gtfs/igr-rail.geojsonseq) \
            --stations gtfs/estaciones.geojson \
            --sources gtfs/sources.tsv --report refdata.md
          cargo run --release -q -p trainradar-refdata-build -- verify build/data
          cat refdata.md >> "$GITHUB_STEP_SUMMARY"
      # Plan ahead (docs/plan-future.md): the same feeds over 63 days, as far
      # as they go, without track, in data/plan/. The app loads them only
      # for a later date. Without them the site works as before.
      - name: Plan-ahead timetables
        continue-on-error: true
        run: |
          cargo run --release -q -p trainradar-refdata-build -- build --out build/plan --gzip --days 63 \
            --ld gtfs/ld.zip --cercanias gtfs/cercanias.zip $([ -f gtfs/ouigo.zip ] && echo --ouigo gtfs/ouigo.zip) \
            --report plan.md
          cargo run --release -q -p trainradar-refdata-build -- verify build/plan
          mv build/plan build/data/plan
          { echo "## Plan-ahead timetables"; echo; cat plan.md; } >> "$GITHUB_STEP_SUMMARY"

      # The UK (plan 3), with UK_ENABLED: Network Rail's timetable, NaPTAN and
      # Great Britain's OSM track → data/uk/. A UK failure never stops
      # Spain's deploy: the site then just has no (or the previous) UK data.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.UK_ENABLED == 'true'
        id: osm_uk
        with:
          path: gtfs/uk/rail.geojsonseq
          # v3: Geofabrik's United Kingdom extract (with Northern Ireland, plan 4).
          key: osm-rail-uk-v3-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-uk-v3-
      - name: UK reference data
        if: vars.UK_ENABLED == 'true'
        continue-on-error: true
        env:
          NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
          NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
          OSM_CACHED: ${{ steps.osm_uk.outputs.cache-hit }}
        run: |
          set -o pipefail # a failed download stops here, with its own message
          [ "$OSM_CACHED" = "true" ] || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-uk.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/uk-data --gzip \
              --uk-schedule gtfs/uk/schedule.json.gz --naptan gtfs/uk/naptan.csv --corpus gtfs/uk/corpus.json.gz \
              --rail gtfs/uk/rail.geojsonseq --report refdata-uk.md \
              $( [ -s gtfs/uk/ni-txc.zip ] && echo --ni-txc gtfs/uk/ni-txc.zip ) \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/uk-data; then
            mv build/uk-data build/data/uk
            # Plan ahead: 63 days as far as published, in data/uk/plan/.
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/uk-plan --gzip --days 63 \
                --uk-schedule gtfs/uk/schedule.json.gz --naptan gtfs/uk/naptan.csv --corpus gtfs/uk/corpus.json.gz \
                $( [ -s gtfs/uk/ni-txc.zip ] && echo --ni-txc gtfs/uk/ni-txc.zip ) --report uk-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/uk-plan; then
              mv build/uk-plan build/data/uk/plan
              { echo "## UK plan-ahead timetables"; echo; cat uk-plan.md; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::UK plan-ahead timetables failed: the UK has today's week only."
            fi
            { echo "## UK reference data"; echo; cat refdata-uk.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::UK reference data failed: deploying Spain only."
            exit 1
          fi

      # Ireland (docs/europe/ie.md), with IE_ENABLED: Irish Rail's timetable
      # from the NTA (no key) and Ireland's OSM track → data/ie/. Like the
      # UK, an Irish failure never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.IE_ENABLED == 'true'
        id: osm_ie
        with:
          path: gtfs/ie/rail.geojsonseq
          key: osm-rail-ie-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-ie-v1-
      - name: Ireland reference data
        if: vars.IE_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_ie.outputs.cache-hit }}
        run: |
          set -o pipefail # a failed download stops here, with its own message
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-ie.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/ie-data --gzip \
              --ie-gtfs gtfs/ie/GTFS_Irish_Rail.zip --sources gtfs/ie/sources.tsv \
              $([ -s gtfs/ie/rail.geojsonseq ] && echo --rail gtfs/ie/rail.geojsonseq) --report refdata-ie.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/ie-data; then
            mv build/ie-data build/data/ie
            # Plan ahead: as far as the NTA publishes (about 3 weeks), in data/ie/plan/.
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/ie-plan --gzip --days 63 \
                --ie-gtfs gtfs/ie/GTFS_Irish_Rail.zip --report ie-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/ie-plan; then
              mv build/ie-plan build/data/ie/plan
            else
              echo "::warning::Ireland's plan-ahead timetables failed: Ireland has today's week only."
            fi
            { echo "## Ireland reference data"; echo; cat refdata-ie.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Ireland's reference data failed: deploying without Ireland."
            exit 1
          fi

      # France (docs/europe/fr.md), with FR_ENABLED: SNCF's timetable (no key)
      # and France's OSM track → data/fr/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.FR_ENABLED == 'true'
        id: osm_fr
        with:
          path: gtfs/fr/rail.geojsonseq
          key: osm-rail-fr-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-fr-v1-
      - name: France reference data
        if: vars.FR_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_fr.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-fr.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/fr-data --gzip \
              --fr-gtfs gtfs/fr/sncf.zip --sources gtfs/fr/sources.tsv \
              $([ -s gtfs/fr/rail.geojsonseq ] && echo --rail gtfs/fr/rail.geojsonseq) --report refdata-fr.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/fr-data; then
            mv build/fr-data build/data/fr
            # Plan ahead: 9 weeks (SNCF publishes about 5 months), in data/fr/plan/.
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/fr-plan --gzip --days 63 \
                --fr-gtfs gtfs/fr/sncf.zip --report fr-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/fr-plan; then
              mv build/fr-plan build/data/fr/plan
            else
              echo "::warning::France's plan-ahead timetables failed: France has today's week only."
            fi
            { echo "## France reference data"; echo; cat refdata-fr.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::France's reference data failed: deploying without France."
            exit 1
          fi

      # Luxembourg (docs/europe/west-central.md), with LU_ENABLED: CFL's trains
      # from the national GTFS (no key), by timetable → data/lu/.
      - name: Luxembourg reference data
        if: vars.LU_ENABLED == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-lu.sh | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/lu-data --gzip \
              --lu-gtfs gtfs/lu/gtfs.zip --sources gtfs/lu/sources.tsv \
              $([ -s gtfs/lu/rail.geojsonseq ] && echo --rail gtfs/lu/rail.geojsonseq) --report refdata-lu.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/lu-data; then
            mv build/lu-data build/data/lu
            { echo "## Luxembourg reference data"; echo; cat refdata-lu.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Luxembourg's reference data failed: deploying without Luxembourg."
            exit 1
          fi

      # Finland (M2, docs/europe/registrations.md), with FI_ENABLED: open timetable
      # (no key) and OSM track → data/fi/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.FI_ENABLED == 'true'
        id: osm_fi
        with:
          path: gtfs/fi/rail.geojsonseq
          key: osm-rail-fi-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-fi-v1-
      - name: Finland reference data
        if: vars.FI_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_fi.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh fi | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/fi-data --gzip \
              --fi-gtfs gtfs/fi/gtfs.zip --sources gtfs/fi/sources.tsv \
              $([ -s gtfs/fi/rail.geojsonseq ] && echo --rail gtfs/fi/rail.geojsonseq) --report refdata-fi.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/fi-data; then
            mv build/fi-data build/data/fi
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/fi-plan --gzip --days 63 \
                --fi-gtfs gtfs/fi/gtfs.zip --report fi-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/fi-plan; then
              mv build/fi-plan build/data/fi/plan
            else
              echo "::warning::Finland's plan-ahead timetables failed: Finland has today's week only."
            fi
            { echo "## Finland reference data"; echo; cat refdata-fi.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Finland's reference data failed: deploying without Finland."
            exit 1
          fi

      # Norway (M2, docs/europe/registrations.md), with NO_ENABLED: open timetable
      # (no key) and OSM track → data/no/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.NO_ENABLED == 'true'
        id: osm_no
        with:
          path: gtfs/no/rail.geojsonseq
          key: osm-rail-no-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-no-v1-
      - name: Norway reference data
        if: vars.NO_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_no.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh no | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/no-data --gzip \
              --no-gtfs gtfs/no/gtfs.zip --sources gtfs/no/sources.tsv \
              $([ -s gtfs/no/rail.geojsonseq ] && echo --rail gtfs/no/rail.geojsonseq) --report refdata-no.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/no-data; then
            mv build/no-data build/data/no
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/no-plan --gzip --days 63 \
                --no-gtfs gtfs/no/gtfs.zip --report no-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/no-plan; then
              mv build/no-plan build/data/no/plan
            else
              echo "::warning::Norway's plan-ahead timetables failed: Norway has today's week only."
            fi
            { echo "## Norway reference data"; echo; cat refdata-no.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Norway's reference data failed: deploying without Norway."
            exit 1
          fi

      # Netherlands (M2, docs/europe/registrations.md), with NL_ENABLED: open timetable
      # (no key) and OSM track → data/nl/. Never stops the rest of the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.NL_ENABLED == 'true'
        id: osm_nl
        with:
          path: gtfs/nl/rail.geojsonseq
          key: osm-rail-nl-v1-${{ steps.week.outputs.week }}
          restore-keys: osm-rail-nl-v1-
      - name: Netherlands reference data
        if: vars.NL_ENABLED == 'true'
        continue-on-error: true
        env:
          OSM_CACHED: ${{ steps.osm_nl.outputs.cache-hit }}
        run: |
          set -o pipefail
          [ "$OSM_CACHED" = "true" ] || command -v osmium >/dev/null || { sudo apt-get update && sudo apt-get install -y osmium-tool; }
          tools/fetch-eu.sh nl | tee -a "$GITHUB_STEP_SUMMARY"
          if cargo run --release -q -p trainradar-refdata-build -- build --out build/nl-data --gzip \
              --nl-gtfs gtfs/nl/gtfs.zip --sources gtfs/nl/sources.tsv \
              $([ -s gtfs/nl/rail.geojsonseq ] && echo --rail gtfs/nl/rail.geojsonseq) --report refdata-nl.md \
            && cargo run --release -q -p trainradar-refdata-build -- verify build/nl-data; then
            mv build/nl-data build/data/nl
            if cargo run --release -q -p trainradar-refdata-build -- build --out build/nl-plan --gzip --days 63 \
                --nl-gtfs gtfs/nl/gtfs.zip --report nl-plan.md \
              && cargo run --release -q -p trainradar-refdata-build -- verify build/nl-plan; then
              mv build/nl-plan build/data/nl/plan
            else
              echo "::warning::Netherlands's plan-ahead timetables failed: Netherlands has today's week only."
            fi
            { echo "## Netherlands reference data"; echo; cat refdata-nl.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Netherlands's reference data failed: deploying without Netherlands."
            exit 1
          fi

      # Switzerland (M3), with CH_ENABLED: opentransportdata.swiss's timetable (no key)
      # and OSM track → data/ch/; live delays from the eu job. Never stops the deploy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: vars.CH_ENABLED == 'true'
        id: osm_ch
        with:
