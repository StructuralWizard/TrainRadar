# Phase 3a: checks Network Rail's open data feeds with the maintainer's
# account (repository secrets NETWORK_RAIL_USERNAME / NETWORK_RAIL_PASSWORD):
# login, live topic rates and message types (TRUST, VSTP, TD), and the
# SCHEDULE, CORPUS and SMART files. Manual only: it uses secrets, so it never
# runs on pull requests. The report and real message samples are uploaded as
# an artifact; credentials are never printed.
name: UK feed check

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to listen to the live topics (seconds)
        default: "120"
      full_schedule:
        description: Also download the full daily SCHEDULE (large)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    # Secrets only on main, never on another branch's code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tools/uk-feed-check/stomp.test.mjs
      - name: Check the feeds
        env:
          NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
          NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
          SECONDS_IN: ${{ inputs.seconds }}
          FULL: ${{ inputs.full_schedule }}
        run: |
          mkdir -p out
          [[ "$SECONDS_IN" =~ ^[0-9]+$ ]] || { echo "seconds must be a number"; exit 1; }
          extra=()
          [ "$FULL" = "true" ] && extra+=(--full-schedule)
          node tools/uk-feed-check/check.mjs --seconds "$SECONDS_IN" --out out "${extra[@]}"
      - if: always()
        run: '[ -f out/report.md ] && cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uk-feed-check
          path: out/
          if-no-files-found: ignore
