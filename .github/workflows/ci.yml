name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml pins the version, components and wasm target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p trainradar-engine --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: wasm build + size report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (version from Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: SIZE_REPORT=size.md tools/build-wasm.sh
      - run: cat size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: web-pkg
          path: web/pkg
          retention-days: 7
