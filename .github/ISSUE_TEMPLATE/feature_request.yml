name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can run entirely in the browser (no server-side processing)
        - label: This works without sharing location, or location stays in the browser
