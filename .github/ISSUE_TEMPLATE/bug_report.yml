name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the map\n2. Tap a train\n3. ..."
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 7, Chrome 142
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors or screenshots
      description: Please don't share your precise location.
