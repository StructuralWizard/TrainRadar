# Cloudflare Worker: CORS pass-through for Renfe GTFS-RT (see src/index.js).
# Deployed from CI in phase A7. No secrets here.
name = "trainradar-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Origins allowed to read the feeds from a browser. Add the Pages URL once deployed.
ALLOWED_ORIGINS = "https://trainradar.pages.dev,https://mytrainradar.com,https://www.mytrainradar.com,http://localhost:8080"
